/* ============ 水表 / 电表录入 ============ */
function renderWater(){renderMeters('water');}
function renderElec(){renderMeters('elec');}
function renderMeters(type){
  const label=type==='water'?'水表':'电表';
  const unit=type==='water'?'吨':'度';
  setActions('<button class="btn primary" id="batchM">'+ic('plus')+'批量录入水表电表</button>');
  const q=document.getElementById('view-body');
  q.innerHTML='<div class="quick-entry"><div class="qe-title">'+ic('plus')+'快速录入'+label+'读数（每月抄录一次）</div>'
    +'<div class="qe-grid">'
    +'<div class="fld"><label>房间 *</label><select id="qeRoom">'+roomOptionsHtml()+'</select></div>'
    +'<div class="fld"><label>日期 *</label><input type="date" id="qeDate" value="'+todayStr()+'"></div>'
    +'<div class="fld"><label>读数（'+unit+'）*</label><input type="number" id="qeReading" min="0" step="0.1" placeholder="当前表显读数"></div>'
    +'<div class="fld" id="qeBaseBox" style="display:none"><label>期初读数（'+unit+'）</label><input type="number" id="qeBase" min="0" step="0.1" placeholder="开始计费时的读数"><div class="hint">该表没有上期读数，本月用量 = 本次读数 − 期初读数；之后每月自动用上月读数</div></div>'
    +'<div class="fld"><label class="check"><input type="checkbox" id="qeReset"> 换表 / 归零重置</label><div class="hint" id="qeResetHint">勾选后：填写旧表最终读数，之后从新表重新起算</div></div>'
    +'<div class="fld"><label>备注</label><input id="qeRemark" placeholder="如：换新表、水费已收"></div>'
    +'<div class="fld"><label>&nbsp;</label><button class="btn primary" id="qeSave">'+ic('plus')+'录入</button></div>'
    +'</div>'
    +'<div class="last-read" id="qeLast"></div></div>'
    +'<div class="toolbar"><div class="filters"><select id="mRoom"><option value="">全部房间</option>'+state.rooms.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no),'zh-Hant',{numeric:true})).map(r=>'<option value="'+r.id+'">'+esc(r.no)+'</option>').join('')+'</select>'
    +scopeHTML('mScope','mMonth','mYear',latestMeterMonth(type)||currentMonth(),'y')+'</div>'
    +'<div style="margin-left:auto;font-size:12px;color:var(--text-3)" id="mCount"></div></div>'
    +'<div id="mGrid"></div>';
  const roomSel=document.getElementById('qeRoom');
  const updLast=()=>{
    const rid=roomSel.value;
    const el=document.getElementById('qeLast');
    const isReset=document.getElementById('qeReset').checked;
    const baseBox=document.getElementById('qeBaseBox');
    if(!rid){el.innerHTML='';baseBox.style.display='none';return;}
    const lr=latestReading(state[type],rid);
    const p=priceOf(rid);
    const base='<b>'+esc(roomNo(rid))+'</b> 目前累计读数：';
    if(!lr){el.innerHTML=base+'<b>0</b> '+unit+'（尚无记录）';
      baseBox.style.display=isReset?'none':'block';
      return;}
    const afterReset=lr.event===RESET_EVENT;
    baseBox.style.display=(isReset||!afterReset)?'none':'block';
    const resetBox=document.getElementById('qeReset');
    const resetFld=resetBox.closest('.fld');
    const resetLbl=resetFld.querySelector('label');
    const resetHint=document.getElementById('qeResetHint');
    if(afterReset){
      // 上次是换表：本次为新表第一次录入，隐藏归零勾选，防止二次清零
      resetBox.checked=false;resetLbl.style.display='none';
      resetHint.textContent='上期已换表：本次直接录入新表读数即可，无需再次勾选换表/归零（防止二次清零）';
    }else{
      resetLbl.style.display='';
      resetHint.textContent='勾选后：填写旧表最终读数，之后从新表重新起算';
    }
    const prev=isReset?'（本次为旧表最终读数，换表后新表从 0 重新起算）':(afterReset?'（上期为换表归零，本次为新表读数，请填新表起始读数，从 0 起可填 0 或留空）':'');
    el.innerHTML=base+'<b>'+lr.eff+'</b> '+unit+' · 最近记录 '+esc(lr.date)+'（原始读数 '+num(lr.reading)+'）'+prev;
  };
  roomSel.addEventListener('change',updLast);
  document.getElementById('qeReset').addEventListener('change',updLast);
  document.getElementById('qeSave').onclick=()=>{
    const rid=roomSel.value,date=document.getElementById('qeDate').value,reading=document.getElementById('qeReading').value;
    const isReset=document.getElementById('qeReset').checked;
    const baseVal=document.getElementById('qeBaseBox').style.display==='none'?'':document.getElementById('qeBase').value;
    if(!rid){toast('请选择房间','err');return;}
    if(!date){toast('请选择日期','err');return;}
    if(reading===''||reading===null){toast('请填写读数','err');return;}
    if(!isReset&&baseVal!==''&&baseVal!=null&&num(baseVal)>num(reading)){toast('期初读数不能大于本次读数','err');return;}
    state[type].push({id:uid(),roomId:rid,date,reading:num(reading),event:isReset?RESET_EVENT:'normal',base:baseVal!==''?num(baseVal):'',remark:document.getElementById('qeRemark').value.trim(),createdAt:new Date().toISOString()});
    save();document.getElementById('qeReading').value='';document.getElementById('qeRemark').value='';document.getElementById('qeBase').value='';
    const mSc=document.getElementById('mScope');if(!mSc||mSc.value!=='y')document.getElementById('mMonth').value=date.slice(0,7);
    drawMeters(type);updLast();
    let n=refreshBillsFor(rid,date.slice(0,7));
    if(currentView==='summary')drawSummary();
    if(currentView==='bills')drawBills();
    toast('已录入 '+roomNo(rid)+' '+label+' 读数 '+reading+unit+'（'+date.slice(0,7)+'）'+(n?'，账单已自动同步更新':''),'ok');
  };
  document.getElementById('batchM').onclick=openBatchEntry;
  document.getElementById('mRoom').addEventListener('change',()=>drawMeters(type));
  bindScope('mScope','mMonth','mYear',()=>drawMeters(type))();
}
/* 批量录入：所有房间一次录完水表+电表，保存后自动汇总、自动生成账单 */
function openBatchEntry(){
  if(!state.rooms.length){toast('请先新增房间','err');return;}
  const rooms=state.rooms.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no),'zh-Hant',{numeric:true}));
  const rowsHtml=rooms.map(r=>{
    const lw=latestReading(state.water,r.id),le=latestReading(state.elec,r.id);
    const wReset=lw&&lw.event===RESET_EVENT,eReset=le&&le.event===RESET_EVENT;
    const cell=(cls,hasPrev,prevEff,unit,prevReset)=>'<td><input type="number" class="'+cls+'" min="0" step="0.1" placeholder="当前读数">'
      +(hasPrev&&!prevReset?'<div class="bprev">上期 '+prevEff+' '+unit+'</div>':'<input type="number" class="'+cls+'b" min="0" step="0.1" placeholder="期初读数">')
      +'</td>';
    return '<tr data-rid="'+r.id+'">'
      +'<td><b>'+esc(r.no)+'</b><div style="font-size:10.5px;color:var(--text-3)">'+esc(r.status||'')+'</div></td>'
      +cell('bw',!!lw,lw?lw.eff:'0','吨',wReset)
      +cell('be',!!le,le?le.eff:'0','度',eReset)
      +'<td class="c">'+(wReset?'<span class="badge gray" style="white-space:nowrap"><span class="bd"></span>已换表</span>':'<label class="check" title="水表换表/归零"><input type="checkbox" class="rw"></label>')+'</td>'
      +'<td class="c">'+(eReset?'<span class="badge gray" style="white-space:nowrap"><span class="bd"></span>已换表</span>':'<label class="check" title="电表换表/归零"><input type="checkbox" class="re"></label>')+'</td>'
      +'</tr>';
  }).join('');
  const ov=openModal(modalShell('批量录入水表 + 电表（所有房间）',
    '<div class="fgrid" style="margin-bottom:12px">'
    +field('日期 *',inp('batchDate',todayStr(),{type:'date'}))
    +'<div class="fld"><label class="check" style="margin-top:22px"><input type="checkbox" id="batchAuto" checked> 保存后自动生成下月账单（本月水电 + 下月房租）</label></div>'
    +'</div>'
    +'<div class="table-wrap" style="max-height:46vh;overflow:auto"><table class="grid" style="min-width:640px"><colgroup><col style="width:22%"><col style="width:27%"><col style="width:27%"><col style="width:12%"><col style="width:12%"></colgroup>'
    +'<thead><tr><th>房间</th><th>水表读数（吨）</th><th>电表读数（度）</th><th>水换表</th><th>电换表</th></tr></thead>'
    +'<tbody>'+rowsHtml+'</tbody></table></div>'
    +'<div style="font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.8">只填写今天实际抄到的读数；没抄到的留空即可。有上期读数的自动按「本月 − 上期」算用量；该表第一次录入（无上期）时，请在输入框下方填「期初读数」，本月用量 = 本次读数 − 期初读数，之后每月自动用上月读数。勾选「换表」表示旧表已更换/归零，此格填旧表最终读数。已换表的房间下次录入会显示「已换表」，直接录新表读数即可，无需再勾选。保存后已生成的账单会按最新读数自动重算；需要出账时请用「生成账单」一键生成。</div>'
    ,'<button class="btn" data-close>取消</button><button class="btn primary" id="batchSave">'+ic('check')+'保存录入</button>',true));
  document.getElementById('batchSave').onclick=()=>{
    const date=ov.querySelector('[name=batchDate]').value;
    if(!date){toast('请选择日期','err');return;}
    let w=0,e=0;
    const affected=new Set();
    ov.querySelectorAll('tr[data-rid]').forEach(tr=>{
      const rid=tr.dataset.rid;
      const wv=tr.querySelector('.bw').value,ev=tr.querySelector('.be').value;
      const wb=tr.querySelector('.bwb')?tr.querySelector('.bwb').value:'';
      const eb=tr.querySelector('.beb')?tr.querySelector('.beb').value:'';
      const wr=tr.querySelector('.rw').checked,er=tr.querySelector('.re').checked;
      if(wv!==''&&wv!=null){state.water.push({id:uid(),roomId:rid,date,reading:num(wv),event:wr?RESET_EVENT:'normal',base:wb!==''&&!wr?num(wb):'',remark:wr?'换表/归零':'',createdAt:new Date().toISOString()});w++;affected.add(rid);}
      if(ev!==''&&ev!=null){state.elec.push({id:uid(),roomId:rid,date,reading:num(ev),event:er?RESET_EVENT:'normal',base:eb!==''&&!er?num(eb):'',remark:er?'换表/归零':'',createdAt:new Date().toISOString()});e++;affected.add(rid);}
    });
    if(!w&&!e){toast('请至少填写一个读数','err');return;}
    const month=date.slice(0,7);
    const auto=ov.querySelector('#batchAuto').checked;
    save();
    closeModal(ov);
    let n=0;
    affected.forEach(rid=>{n+=refreshBillsFor(rid,month);});
    if(currentView==='summary')drawSummary();
    if(currentView==='bills')drawBills();
    toast('已录入水表 '+w+' 条、电表 '+e+' 条'+(n?'，账单已自动同步更新':''),'ok');
    if(auto){
      const before=state.bills.length;
      bulkGenBills(nextMonthOf(month),true);
      const made=state.bills.length-before;
      if(made>0)toast('已自动生成 '+made+' 张下月账单（'+monthLabel(nextMonthOf(month))+'），点「租客账单」查看','ok');
    }
    navigate('summary');
  };
}
function drawMeters(type){
  const label=type==='water'?'水':'电';
  const unit=type==='water'?'吨':'度';
  const rid=document.getElementById('mRoom').value;
  const month=scopeVal('mScope','mMonth','mYear');
  let list=state[type].slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  if(rid)list=list.filter(r=>r.roomId===rid);
  if(month)list=list.filter(r=>String(r.date).startsWith(month));
  document.getElementById('mCount').textContent='共 '+list.length+' 条记录';
  const cols=[
    {key:'room',label:'房号',w:'10%',render:r=>'<b>'+esc(roomNo(r.roomId))+'</b>'},
    {key:'date',label:'日期',w:'13%',render:r=>esc(r.date)},
    {key:'reading',label:'表显读数('+unit+')',w:'16%',render:r=>'<span class="num">'+num(r.reading)+'</span>'},
    {key:'ev',label:'事件',w:'12%',render:r=>r.event===RESET_EVENT?'<span class="badge warn"><span class="bd"></span>换表/归零</span>':'<span class="badge green"><span class="bd"></span>正常</span>'},
    {key:'remark',label:'备注',w:'20%',render:r=>esc(r.remark||'—')},
    {key:'op',label:'',w:'15%',render:r=>rowActions(r.id,['edit','del'])}
  ];
  const g=document.getElementById('mGrid');
  renderGrid(g,cols,list.map(r=>Object.assign({},r,{_id:r.id})),{emptyText:'本月暂无'+label+'表记录',emptyIcon:type==='water'?'water':'elec'});
  bindRowActions(g,(act,id)=>{
    if(act==='edit')openMeterForm(type,id);
    if(act==='del')delMeter(type,id);
  });
}
function openMeterForm(type,id){
  const r=state[type].find(x=>x.id===id);
  if(!r)return;
  const ov=openModal(modalShell('编辑'+ (type==='water'?'水表':'电表')+'记录',
    '<div class="fgrid">'
    +field('房间',sel('roomId',state.rooms.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no),'zh-Hant',{numeric:true})).map(x=>({v:x.id,l:x.no})),r.roomId))
    +field('日期',inp('date',r.date,{type:'date'}))
    +field('读数（'+(type==='water'?'吨':'度')+'）',inp('reading',r.reading,{type:'number',min:0,step:0.1}))
    +field('期初读数（'+(type==='water'?'吨':'度')+'）',inp('base',r.base!=null&&r.base!==''?r.base:'',{type:'number',min:0,step:0.1}),{hint:'换表归零后的新表起始读数：从 0 开始可留空；无上月记录首次录入也可在此填起始读数'})
    +field('事件',sel('event',[{v:'normal',l:'正常'},{v:RESET_EVENT,l:'换表 / 归零重置'}],r.event))
    +field('备注',inp('remark',r.remark),{full:true})
    +'</div>'
    ,'<button class="btn" data-close>取消</button><button class="btn primary" id="saveM">保存</button>'));
  ov.querySelector('#saveM').onclick=()=>{
    const oRid=r.roomId,oDate=r.date;
    r.roomId=ov.querySelector('[name=roomId]').value;
    r.date=ov.querySelector('[name=date]').value;
    r.reading=num(ov.querySelector('[name=reading]').value);
    r.base=ov.querySelector('[name=base]').value;
    r.event=ov.querySelector('[name=event]').value;
    r.remark=ov.querySelector('[name=remark]').value.trim();
    save();closeModal(ov);drawMeters(type);
    let n=refreshBillsFor(oRid,oDate.slice(0,7));
    n+=refreshBillsFor(r.roomId,r.date.slice(0,7));
    if(currentView==='summary')drawSummary();
    if(currentView==='bills')drawBills();
    toast('已保存记录'+(n?'，账单已自动同步更新':'（无关联账单）'),'ok');
  };

function yearUsageOf(list,roomId,year){
  let usage=0,has=false,curr=null,prev=null;
  for(let m=1;m<=12;m++){
    const u=monthUsage(list,roomId,year+'-'+pad2(m));
    if(u.usage!=null){usage+=u.usage;has=true;}
    if(u.curr)curr=u.curr;
    if(u.prev)prev=u.prev;
  }
  return {usage:has?money(usage):null,curr,prev};
}
function summaryRows(scope){
  const byYear=String(scope).length===4;
  return state.rooms.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no),'zh-Hant',{numeric:true})).map(r=>{
    let w,e;
    if(byYear){w=yearUsageOf(state.water,r.id,scope);e=yearUsageOf(state.elec,r.id,scope);}
    else{w=monthUsage(state.water,r.id,scope);e=monthUsage(state.elec,r.id,scope);}
    const p=priceOf(r.id);
    const wCost=w.usage!=null?money(w.usage*p.waterPrice):null;
    const eCost=e.usage!=null?money(e.usage*p.elecPrice):null;
    const total=(wCost!=null?wCost:0)+(eCost!=null?eCost:0);
    return {room:r,status:r.status||'在租',w,e,p,wCost,eCost,total,hasData:!!(w.curr||e.curr)};
  });
}

/* ============ 总表对比（总表 vs 分表，按地址分组） ============ */
function meterTypeName(t){return t==='w'?'水表':'电表';}
function meterUnit(t){return t==='w'?'吨':'度';}
function addrOf(x){const a=(x&&x.addr||'').trim();return a||'（未设置）';}
function addrList(){
  const s=new Set();
  state.rooms.forEach(r=>{const a=(r.addr||'').trim();if(a)s.add(a);});
  state.meters.forEach(m=>{const a=(m.addr||'').trim();if(a)s.add(a);});
  return [...s].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
}
function roomsOfAddr(addr){return state.rooms.filter(r=>addrOf(r)===addr);}
function masterPrevOf(m){
  return state.meters.filter(x=>x.type===m.type&&addrOf(x)===addrOf(m)&&x.period<m.period).sort((a,b)=>a.period>b.period?-1:1)[0]||null;
}
function meterUsage(m){
  const prev=masterPrevOf(m);
  if(prev)return money(num(m.reading)-num(prev.reading));
  if(m.base!=null&&m.base!=='')return money(num(m.reading)-num(m.base));
  return null;
}
function subUsageOf(period,type,addr){
  const list=type==='w'?state.water:state.elec;
  let usage=0,missing=0;
  (addr?roomsOfAddr(addr):state.rooms).forEach(r=>{
    const u=monthUsage(list,r.id,period);
    if(u.usage!=null)usage+=u.usage;
    else if(u.curr){missing++;}
  });
  return {usage:money(usage),missing};
}
function meterDiff(m){
  const price=(m.type==='w'?priceOf('').waterPrice:priceOf('').elecPrice)||0;
  const usage=meterUsage(m);
  const sub=subUsageOf(m.period,m.type,addrOf(m));
  const diff=usage!=null?money(usage-sub.usage):null;
  const diffCost=diff!=null?money(diff*price):null;
  const variance=(usage!=null&&m.actualPaid!=null&&m.actualPaid!=='')?money(num(m.actualPaid)-usage*price):null;
  return {usage,sub:sub.usage,subMissing:sub.missing,diff,diffCost,price,variance};
}

function openMasterMeterForm(id){
  const x=id?state.meters.find(m=>m.id===id):null;
  const isNew=!x;
  const ov=openModal(modalShell(isNew?'录入总表':'编辑总表记录',
    '<div class="fgrid">'
    +field('类型',sel('type',[{v:'w',l:'水表（吨）'},{v:'e',l:'电表（度）'}],x?x.type:'w'))
    +field('地址 / 楼栋',sel('addr',[{v:'',l:'（未设置）'}].concat(addrList().map(a=>({v:a,l:a}))),x?(x.addr||''):'')+'<input id="mAddrNew" placeholder="或输入新地址（填此框则使用新地址）" style="margin-top:6px">')
    +field('账期 *',inp('period',x?x.period:currentMonth(),{type:'month'}))
    +'<div class="fld full"><div id="mpPrevInfo" style="font-size:12.5px;color:var(--text-3);line-height:1.7"></div></div>'
    +field('本月总表读数 *',inp('reading',x?x.reading:'',{type:'number',min:0,step:1}))
    +field('期初读数（无上月记录时生效）',inp('base',x?x.base:'',{type:'number',min:0,step:1}),{hint:'该总表没有上月读数时填写；本月用量 = 本次读数 − 期初读数，之后每月自动用上月读数'})
    +field('实际缴费金额（元）',inp('paid',x?x.actualPaid:'',{type:'number',min:0,step:1}),{hint:'你实际交给水务 / 供电公司的金额，留空则「缴费差异」不计算'})
    +field('备注',inp('remark',x?x.remark:''),{full:true})
    +'</div>'
    ,'<button class="btn" data-close>取消</button><button class="btn primary" id="saveMeter">保存</button>'));
  function updPrev(){
    const type=ov.querySelector('[name=type]').value;
    const period=ov.querySelector('[name=period]').value;
    const info=ov.querySelector('#mpPrevInfo');
    if(!period){info.innerHTML='';return;}
    const prev=state.meters.filter(m=>m.type===type&&m.period<period).sort((a,b)=>b.period.localeCompare(a.period))[0];
    info.innerHTML=prev?('上月（'+monthLabel(prev.period)+'）'+meterTypeName(type)+'读数：<b>'+num(prev.reading)+'</b>　本月用量按「本次 − '+num(prev.reading)+'」计算，无需再填期初读数。')
      :('<b>'+meterTypeName(type)+' '+period+'</b> 还没有上月读数：请在下方填「期初读数」，用量按「本次 − 期初读数」计算；之后每月自动用上月读数。');
  }
  ov.querySelector('[name=type]').addEventListener('change',updPrev);
  ov.querySelector('[name=period]').addEventListener('change',updPrev);
  updPrev();
  ov.querySelector('#saveMeter').onclick=()=>{
    const type=ov.querySelector('[name=type]').value;
    const period=ov.querySelector('[name=period]').value;
    const reading=ov.querySelector('[name=reading]').value;
    if(!period){toast('请选择账期','err');return;}
    if(reading===''||reading===null){toast('请填写本月总表读数','err');return;}
    if(state.meters.some(m=>m.id!==id&&m.type===type&&m.period===period)){toast(meterTypeName(type)+' '+period+' 已有记录，可直接编辑','err');return;}
    const rec=x||{id:uid()};
    rec.type=type;rec.period=period;
    const addrNew=ov.querySelector('#mAddrNew')?ov.querySelector('#mAddrNew').value.trim():'';
    const addrSelV=ov.querySelector('[name=addr]').value;
    rec.addr=addrNew||addrSelV;
    rec.reading=money(reading);
    const base=ov.querySelector('[name=base]').value;
    if(base!==''&&base!=null&&num(base)>money(reading)){toast('期初读数不能大于本次读数','err');return;}
    rec.base=base===''?'':money(base);
    const paid=ov.querySelector('[name=paid]').value;
    rec.actualPaid=paid===''?'':money(paid);
    rec.remark=ov.querySelector('[name=remark]').value.trim();
    if(isNew)state.meters.push(rec);
    save();closeModal(ov);drawMasterMeters();toast(isNew?'已录入总表':'已保存总表记录','ok');
  };
}
function delMasterMeter(id){
  const x=state.meters.find(m=>m.id===id);

}

function utilOf(rid,utilMonth,untilDate){
  const w=monthUsage(state.water,rid,utilMonth,untilDate);
  const e=monthUsage(state.elec,rid,utilMonth,untilDate);
  const p=priceOf(rid,utilMonth);
  const wUsage=w.usage!=null?w.usage:0,eUsage=e.usage!=null?e.usage:0;
  return {w,e,p,wUsage,eUsage,wCost:money(wUsage*p.waterPrice),eCost:money(eUsage*p.elecPrice),wNote:meterNote(state.water,rid,utilMonth,'吨'),eNote:meterNote(state.elec,rid,utilMonth,'度')};
}
function refreshBillsFor(rid,um,noSave){
  if(!rid||!um)return 0;
  let n=0;
  state.bills.forEach(b=>{
    if(b.roomId!==rid||b.utilMonth!==um)return;
    if((b.remark||'').includes('分段计费')){
      const splits=splitUtil(rid,um);
      if(Array.isArray(splits)){
        const s=splits.find(x=>x.tenant.name===b.tenantName)||splits.find(x=>b.tenantName&&x.tenant.name.indexOf(b.tenantName)>=0);
        if(s){
          const p=priceOf(rid,um);
          b.prevWater=s.prevW;b.currWater=s.currW;b.waterUsage=s.wUsage;b.waterCost=s.wCost;b.currWaterUsage=s.wUsage;
          b.prevElec=s.prevE;b.currElec=s.currE;b.elecUsage=s.eUsage;b.elecCost=s.eCost;b.currElecUsage=s.eUsage;
          if(num(b.rent)>0){const rb=rentByDays(rid,b.period,null,s.tenant);b.rent=rb.rent;b.rentDays=rb.days;b.rentDaysTotal=rb.total;}
          const owe=money(num(b.waterCost)+num(b.elecCost)+num(b.rent)+num(b.deposit)+num(b.garbageFee)+num(b.netFee)+num(b.mgmtFee)+num(b.parkFee)+num(b.extraFee)+num(b.otherFee)+num(b.prevUtilCost));
          b.total=b.settle==='depart'?money(-owe):owe;
          n++;
        }
      }
      return;
    }
    const u=utilOf(rid,um);
    const wpu=prevUsageOf(state.water,rid,um);
    const epu=prevUsageOf(state.elec,rid,um);
    b.prevWater=u.w.prev?u.w.prev.reading:(u.w.curr&&u.w.curr.base!=null&&u.w.curr.base!==''?u.w.curr.base:null);
    b.currWater=u.w.curr?u.w.curr.reading:null;
    b.waterNote=u.wNote||'';
    b.waterUsage=u.wUsage;b.waterCost=u.wCost;
    b.prevWaterUsage=wpu.usage!=null?wpu.usage:null;b.currWaterUsage=u.wUsage;
    b.prevElec=u.e.prev?u.e.prev.reading:(u.e.curr&&u.e.curr.base!=null&&u.e.curr.base!==''?u.e.curr.base:null);
    b.currElec=u.e.curr?u.e.curr.reading:null;
    b.elecNote=u.eNote||'';
    b.elecUsage=u.eUsage;b.elecCost=u.eCost;
    b.prevElecUsage=epu.usage!=null?epu.usage:null;b.currElecUsage=u.eUsage;
    if(num(b.rent)>0){const rb=rentByDays(rid,b.period);b.rent=rb.rent;b.rentDays=rb.days;b.rentDaysTotal=rb.total;}
    const owe=money(num(b.waterCost)+num(b.elecCost)+num(b.rent)+num(b.deposit)+num(b.garbageFee)+num(b.netFee)+num(b.mgmtFee)+num(b.parkFee)+num(b.extraFee)+num(b.otherFee)+num(b.prevUtilCost));
    b.total=b.settle==='depart'?money(-owe):owe;
    n++;
  });
  if(n&&!noSave)save();
  return n;
}
function refreshAllBills(){
  let n=0;
  state.bills.forEach(b=>{
    const hasVer=state.prices.some(p=>p.roomId===b.roomId&&(!p.month||p.month<=b.utilMonth))||state.prices.some(p=>!p.roomId&&(!p.month||p.month<=b.utilMonth));
    if(!hasVer)return;
    n+=refreshBillsFor(b.roomId,b.utilMonth,true);
  });
  if(n)save();
  return n;
}

        rows.push('<span style="color:var(--amber)">将分别生成 '+splits.length+' 张账单；固定费用（押金/垃圾清洁费/网络费/物管/停车/其他）计入 '+(t?esc(t.name):'主租客')+'</span>');
        sum+=num(rb.rent)+splits.reduce((s,x)=>s+num(x.wCost)+num(x.eCost),0)+num(p.garbageFee)+num(p.netFee)+num(mp.mgmtFee)+num(mp.parkFee)+num(mp.extraFee);
      }else{
        rows.push('水费（<b>'+monthLabel(um)+'</b>）：上月读数 '+(u.w.prev?u.w.prev.reading+'吨':(u.w.curr&&u.w.curr.base!=null&&u.w.curr.base!==''?u.w.curr.base+'吨':'<span style="color:var(--danger)">缺失</span>'))+' → 本月读数 '+(u.w.curr?u.w.curr.reading+'吨':'<span style="color:var(--danger)">缺失</span>')+(u.wNote?'　<span style="color:var(--info)">（'+noteWithUnit(u.wNote,' 吨')+'）</span>':'')+'　用水 <b>'+(u.w.usage!=null?u.w.usage+' 吨':'—')+'</b> × '+p.waterPrice.toFixed(2)+' 元/吨 = <b>'+moneyFmt(u.wCost)+'</b>');
        rows.push('电费（<b>'+monthLabel(um)+'</b>）：上月读数 '+(u.e.prev?u.e.prev.reading+'度':(u.e.curr&&u.e.curr.base!=null&&u.e.curr.base!==''?u.e.curr.base+'度':'<span style="color:var(--danger)">缺失</span>'))+' → 本月读数 '+(u.e.curr?u.e.curr.reading+'度':'<span style="color:var(--danger)">缺失</span>')+(u.eNote?'　<span style="color:var(--info)">（'+noteWithUnit(u.eNote,' 度')+'）</span>':'')+'　用电 <b>'+(u.e.usage!=null?u.e.usage+' 度':'—')+'</b> × '+p.elecPrice.toFixed(2)+' 元/度 = <b>'+moneyFmt(u.eCost)+'</b>');
        if((!u.w.prev&&!(u.w.curr&&u.w.curr.base!=null&&u.w.curr.base!==''))||(!u.e.prev&&!(u.e.curr&&u.e.curr.base!=null&&u.e.curr.base!=='')))rows.push('<span style="color:var(--danger)">缺 '+monthLabel(um)+' 读数，用量无法自动计算，生成后可手动修正。</span>');
        if(!u.w.curr&&!u.e.curr)rows.push('<span style="color:var(--danger)">'+monthLabel(um)+' 暂无水电录入，请先录入该月水电表。</span>');
        if(splits&&splits.need)rows.push('<span style="color:var(--danger)">该月多人分段在住，需在租客切换日分别抄表才能精确分段。缺：'+splits.need.join('、')+'</span>');
        const ext=[];
        if(num(mp.mgmtFee)>0)ext.push('物管 '+moneyFmt(mp.mgmtFee));
        if(num(mp.parkFee)>0)ext.push('停车 '+moneyFmt(mp.parkFee));
        if(num(mp.extraFee)>0)ext.push('其他 '+moneyFmt(mp.extraFee));
        if(ext.length)rows.push('固定杂费（当月预收，自动计入）：'+ext.join(' / '));
        sum+=num(u.wCost)+num(u.eCost)+num(rb.rent)+num(p.garbageFee)+num(p.netFee)+num(mp.mgmtFee)+num(mp.parkFee)+num(mp.extraFee);
      }
      if(t)rows.push('自动匹配租客：<b>'+esc(t.name)+'</b>'+(t.leaseStart?'（租期自 '+esc(t.leaseStart)+'）':''));
      const exist=state.bills.find(b=>b.roomId===rid&&b.period===period);
      if(exist)rows.push('<span style="color:var(--amber)">该房间此收款月已存在账单（'+moneyFmt(exist.total)+'），重新生成将覆盖。</span>');
      blocks.push('<div style="'+(blocks.length?'margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-2)':'')+'"><b>'+esc(roomNo(rid))+'</b>：'+rows.join('<br>')+'</div>');

  }
  periodInp.addEventListener('change',preview);
  ov.querySelector('#doGen').onclick=()=>{
    try{
      const period=periodInp.value;
      if(!selected.size||!period){
        ov.querySelector('#billPreview').innerHTML=rooms.length?'<span style="color:var(--danger)">请先选择上方房间，再点「生成账单」。</span>':'<span style="color:var(--danger)">暂无房间，请先在「房间信息」新增房间，再回来生成账单。</span>';
        toast(rooms.length?'请先选择房间':'暂无房间，请先新增房间','err');return;
      }
      const um=prevMonthOf(period);
      const otherFee=num(ov.querySelector('[name=otherFee]').value);
      const otherName=ov.querySelector('[name=otherName]').value.trim();
      const dueDate=ov.querySelector('[name=dueDate]').value||period+'-05';
      const remark=ov.querySelector('[name=remark]').value.trim();
      let made=[];
      rooms.filter(r=>selected.has(r.id)).forEach(r=>{
      const rid=r.id;
      const u=utilOf(rid,um);
      const wpu=prevUsageOf(state.water,rid,um);
      const epu=prevUsageOf(state.elec,rid,um);
      const p=u.p;
      const mp=priceOf(rid,period);
      const tenantName=primaryTenant(rid)?primaryTenant(rid).name:'';
      const splits=splitUtil(rid,um);
      const primary=primaryTenant(rid);
      const mk=(t,seg)=>{
        const isMain=!t||!primary||t.id===primary.id;
        const rb=rentByDays(rid,period,null,t||primary);
        const wu=seg?seg.wUsage:u.wUsage,eu=seg?seg.eUsage:u.eUsage;
        const bill={
          id:uid(),roomId:rid,period,
          tenantName:t?t.name:(tenantName||(primary?primary.name:'')),
          rentMonth:period,utilMonth:um,
          prevWater:seg?seg.prevW:(u.w.prev?u.w.prev.reading:(u.w.curr&&u.w.curr.base!=null&&u.w.curr.base!==''?u.w.curr.base:null)),
          currWater:seg?seg.currW:(u.w.curr?u.w.curr.reading:null),
          waterUsage:wu!=null?wu:null,waterCost:wu!=null?money(wu*p.waterPrice):null,waterNote:seg?'':(u.wNote||''),
          prevWaterUsage:wpu.usage!=null?wpu.usage:null,currWaterUsage:wu!=null?wu:null,
          prevElec:seg?seg.prevE:(u.e.prev?u.e.prev.reading:(u.e.curr&&u.e.curr.base!=null&&u.e.curr.base!==''?u.e.curr.base:null)),
          currElec:seg?seg.currE:(u.e.curr?u.e.curr.reading:null),
          elecUsage:eu!=null?eu:null,elecCost:eu!=null?money(eu*p.elecPrice):null,elecNote:seg?'':(u.eNote||''),
          prevElecUsage:epu.usage!=null?epu.usage:null,currElecUsage:eu!=null?eu:null,
          rent:items.has('rent')?rb.rent:0,rentDays:rb.days,rentDaysTotal:rb.total,
          deposit:items.has('deposit')&&isMain?p.deposit:0,
          garbageFee:items.has('garbageFee')&&isMain?p.garbageFee:0,
          netFee:items.has('netFee')&&isMain?p.netFee:0,
          mgmtFee:isMain?mp.mgmtFee:0,
          parkFee:isMain?mp.parkFee:0,
          extraFee:isMain?mp.extraFee:0,
          otherFee:isMain?otherFee:0,otherName:isMain?otherName:'',
          dueDate,
          remark:seg?(remark?remark+'；':'')+'分段计费：'+t.name+' '+seg.start.slice(5)+'~'+seg.end.slice(5):remark,
          status:'未缴',createdAt:new Date().toISOString()
        };
        bill.total=money(num(bill.waterCost)+num(bill.elecCost)+num(bill.rent)+num(bill.deposit)+num(bill.garbageFee)+num(bill.netFee)+num(bill.mgmtFee)+num(bill.parkFee)+num(bill.extraFee)+num(bill.otherFee));
        return bill;
      };
      let arr=[];
      if(Array.isArray(splits))arr=splits.map(s=>mk(s.tenant,s));
      else arr=[mk(null,null)];
      arr.forEach(bill=>{
        const idx=state.bills.findIndex(b=>b.roomId===rid&&b.period===period&&b.tenantName===bill.tenantName);
        if(idx>=0)state.bills[idx]=bill;else state.bills.push(bill);
      });
      made=made.concat(arr);
    });
    save();closeModal(ov);
    if(currentView==='bills')drawBills();else renderOverview();
    toast('已生成 '+made.length+' 张账单（'+[...selected].map(rid=>roomNo(rid)).join('、')+' '+monthLabel(period)+'）','ok');
    if(made.length===1)showBill(made[0].id);
    }catch(e){
      console.error('生成账单失败',e);
      toast('生成失败：'+(e&&e.message?e.message:e),'err');
    }
  };
  try{preview();}catch(e){console.error('预览计算失败',e);}
}
function bulkGenBills(billMonth,silent){
  const rooms=state.rooms.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no),'zh-Hant',{numeric:true}));
  const um=prevMonthOf(billMonth);
  let made=0,skipped=0;
  rooms.forEach(r=>{
    if(state.bills.find(b=>b.roomId===r.id&&b.period===billMonth)){skipped++;return;}
    const splits=splitUtil(r.id,um);
    if(Array.isArray(splits)){
      const p=priceOf(r.id,um);
      const mp=priceOf(r.id,billMonth);
      const primary=primaryTenant(r.id);
      splits.forEach(s=>{
        const rb=rentByDays(r.id,billMonth,null,s.tenant);
        const isMain=!primary||s.tenant.id===primary.id;
        const bill={id:uid(),roomId:r.id,period:billMonth,tenantName:s.tenant.name,
          rentMonth:billMonth,utilMonth:um,
          prevWater:s.prevW,currWater:s.currW,waterUsage:s.wUsage,waterCost:s.wCost,waterNote:'',
          prevWaterUsage:null,currWaterUsage:s.wUsage,
          prevElec:s.prevE,currElec:s.currE,elecUsage:s.eUsage,elecCost:s.eCost,elecNote:'',
          prevElecUsage:null,currElecUsage:s.eUsage,
          rent:rb.rent,rentDays:rb.days,rentDaysTotal:rb.total,
          deposit:0,garbageFee:isMain?p.garbageFee:0,netFee:isMain?p.netFee:0,
          mgmtFee:isMain?mp.mgmtFee:0,parkFee:isMain?mp.parkFee:0,extraFee:isMain?mp.extraFee:0,
          otherFee:0,otherName:'',dueDate:billMonth+'-05',
          remark:'分段计费：'+s.tenant.name+' '+s.start.slice(5)+'~'+s.end.slice(5),
          status:'未缴',createdAt:new Date().toISOString()};
        bill.total=money(num(bill.waterCost)+num(bill.elecCost)+num(bill.rent)+num(bill.garbageFee)+num(bill.netFee)+num(bill.mgmtFee)+num(bill.parkFee)+num(bill.extraFee));
        state.bills.push(bill);
      });
      made++;return;
    }
    const t=primaryTenant(r.id);
    if(!t||t.status!=='在住'){skipped++;return;}
    const hasUtil=lastReadingIn(state.water,r.id,um)||lastReadingIn(state.elec,r.id,um);
    if(!hasUtil){skipped++;return;}
    const u=utilOf(r.id,um);
    const wpu=prevUsageOf(state.water,r.id,um);
    const epu=prevUsageOf(state.elec,r.id,um);
    const p=u.p;
    const mp=priceOf(r.id,billMonth);
    const rb=rentByDays(r.id,billMonth);
    const bill={id:uid(),roomId:r.id,period:billMonth,tenantName:t?t.name:'',
      rentMonth:billMonth,utilMonth:um,
      prevWater:u.w.prev?u.w.prev.reading:(u.w.curr&&u.w.curr.base!=null&&u.w.curr.base!==''?u.w.curr.base:null),currWater:u.w.curr?u.w.curr.reading:null,waterUsage:u.wUsage,waterCost:u.wCost,waterNote:u.wNote||'',
      prevWaterUsage:wpu.usage!=null?wpu.usage:null,currWaterUsage:u.wUsage,
      prevElec:u.e.prev?u.e.prev.reading:(u.e.curr&&u.e.curr.base!=null&&u.e.curr.base!==''?u.e.curr.base:null),currElec:u.e.curr?u.e.curr.reading:null,elecUsage:u.eUsage,elecCost:u.eCost,elecNote:u.eNote||'',
      prevElecUsage:epu.usage!=null?epu.usage:null,currElecUsage:u.eUsage,
      rent:t?rb.rent:0,rentDays:t?rb.days:0,rentDaysTotal:rb.total,
      deposit:0,garbageFee:p.garbageFee,netFee:p.netFee,
      mgmtFee:mp.mgmtFee,parkFee:mp.parkFee,extraFee:mp.extraFee,
      otherFee:0,otherName:'',
      dueDate:billMonth+'-05',remark:'',status:'未缴',createdAt:new Date().toISOString()};
    bill.total=money(num(bill.waterCost)+num(bill.elecCost)+num(bill.rent)+num(bill.garbageFee)+num(bill.netFee)+num(bill.mgmtFee)+num(bill.parkFee)+num(bill.extraFee));
    state.bills.push(bill);
    made++;
  });
  save();
  if(!silent){
    if(!rooms.length)toast('暂无房间，请先在「房间信息」新增房间','err');
    else if(!made&&!skipped)toast('没有可生成账单的房间','err');
    else if(!made)toast('已生成 0 张账单：'+skipped+' 间被跳过（非在租 / 上月无水电记录 / 已有账单）','err');
    else toast('已生成 '+made+' 张账单'+(skipped?'，跳过 '+skipped+' 间（非在租 / 上月无水电记录 / 已有账单）':''),'ok');
  }
}
function openBulkGen(){
  const defM=nextMonthOf(currentMonth());
  const ov=openModal(modalShell('批量生成账单（按月一键出账）',
    '<div class="fgrid">'
    +field('收款月份 *',inp('bkMonth',defM,{type:'month'}),{hint:'出该月账单：房租按全月计算，水电取上月（'+monthLabel(prevMonthOf(defM))+'）记录；账单默认该月 5 号前交租'})
    +'<div class="fld full"><div id="bkPreview" style="font-size:12.5px;color:var(--text-3)"></div></div>'
    +'</div>',
    '<button class="btn" data-close>取消</button><button class="btn primary" id="doBulk">'+ic('doc')+'一键生成</button>',true));
  function preview(){
    const bm=ov.querySelector('[name=bkMonth]').value;
    const box=ov.querySelector('#bkPreview');
    if(!bm){box.innerHTML='请选择收款月份。';return;}
    const um=prevMonthOf(bm);
    let ready=0,skipNoTenant=0,skipNoUtil=0,skipDup=0,sum=0;
    state.rooms.forEach(r=>{
      if(state.bills.find(b=>b.roomId===r.id&&b.period===bm)){skipDup++;return;}
      const splits=splitUtil(r.id,um);
      if(Array.isArray(splits)){
        const p=priceOf(r.id,um);
        const mp=priceOf(r.id,bm);
        splits.forEach(s=>{sum+=num(s.wCost)+num(s.eCost)+num(rentByDays(r.id,bm,null,s.tenant).rent)+num(p.garbageFee)+num(p.netFee)+num(mp.mgmtFee)+num(mp.parkFee)+num(mp.extraFee);});
        ready++;return;
      }
      const t=primaryTenant(r.id);
      if(!t||t.status!=='在住'){skipNoTenant++;return;}
      const hasUtil=lastReadingIn(state.water,r.id,um)||lastReadingIn(state.elec,r.id,um);
      if(!hasUtil){skipNoUtil++;return;}
      const u=utilOf(r.id,um);
      const mp=priceOf(r.id,bm);
      sum+=num(u.wCost)+num(u.eCost)+num(rentByDays(r.id,bm).rent)+num(u.p.garbageFee)+num(u.p.netFee)+num(mp.mgmtFee)+num(mp.parkFee)+num(mp.extraFee);
      ready++;
    });
    const lines=['收款月：<b>'+monthLabel(bm)+'</b>　水电月：'+monthLabel(um)];
    if(!state.rooms.length){
      lines.push('<span style="color:var(--danger)">暂无房间，请先在「房间信息」新增房间，再回来生成账单。</span>');
      box.innerHTML=lines.join('<br>');return;
    }
    lines.push('可一键生成 <b>'+ready+'</b> 间房账单'+(ready?'，合计约 <b>'+moneyFmt(sum)+'</b>':''));
    if(skipNoTenant)lines.push('跳过 '+skipNoTenant+' 间：非在租 / 无在住租客');
    if(skipNoUtil)lines.push('跳过 '+skipNoUtil+' 间：'+monthLabel(um)+' 无水电记录');
    if(skipDup)lines.push('跳过 '+skipDup+' 间：该月已有账单');
    lines.push('<span style="color:var(--text-3)">分租分段房间（月中换租客且分别抄表）会自动拆分为多人账单，每人承担各自时段水电。</span>');
    box.innerHTML=lines.join('<br>');
  }
  ov.querySelector('[name=bkMonth]').addEventListener('change',preview);
  preview();
  ov.querySelector('#doBulk').onclick=()=>{
    const bm=ov.querySelector('[name=bkMonth]').value;
    if(!bm){toast('请选择收款月份','err');return;}
    if(!state.rooms.length){toast('暂无房间，请先在「房间信息」新增房间','err');return;}
    bulkGenBills(bm);
    closeModal(ov);if(currentView==='bills')drawBills();
  };
}
function openDepartBill(){

  const roomSel=ov.querySelector('[name=roomId]'),dateInp=ov.querySelector('[name=departDate]');
  function preview(){

    const gf=p.garbageFee,nf=p.netFee*rb.days/rb.total;
    const mf=(p.mgmtFee||0)*rb.days/rb.total,pf=(p.parkFee||0)*rb.days/rb.total,ef=(p.extraFee||0)*rb.days/rb.total;

    if(!prevBill||prevBill.status!=='已缴'){pu=utilOf(rid,um);prevUtilCost=money(pu.wCost+pu.eCost+pu.p.garbageFee+pu.p.netFee);}
    const owed=money(rb.rent+u.wCost+u.eCost+gf+nf+mf+pf+ef+prevUtilCost);
    const total=money(dep-owed);
    const rows=[];
    rows.push('收款月：<b>'+monthLabel(period)+'</b>（结清至 '+esc(date)+'）');
    rows.push('房租（<b>'+monthLabel(period)+'</b>）：<b>'+moneyFmt(rb.rent)+'</b>　'+rb.note);

    else rows.push('上月杂费（'+monthLabel(um)+'）：已缴清，无需累积');
    rows.push('本月水费（至 '+esc(date)+'）：<b>'+moneyFmt(u.wCost)+'</b>（'+(u.w.usage!=null?u.w.usage+' 吨':'暂无记录')+'）　电费：<b>'+moneyFmt(u.eCost)+'</b>（'+(u.e.usage!=null?u.e.usage+' 度':'暂无记录')+'）');
    rows.push('垃圾清洁费按整月收取：<b>'+moneyFmt(gf)+'</b>　网络费按天折算：<b>'+moneyFmt(nf)+'</b>'+(mf||pf||ef?('　杂费按天折算：'+[mf?'物管 '+moneyFmt(mf):'',pf?'停车 '+moneyFmt(pf):'',ef?'其他 '+moneyFmt(ef):''].filter(Boolean).join(' / ')):''));
    rows.push('应付合计：<b>'+moneyFmt(owed)+'</b>');

    if(exist)rows.push('<span style="color:var(--amber)">该房间此收款月已有账单'+(exist.status==='已缴'?'（已缴费，将另生成结算单并存，不覆盖）':'，生成将覆盖')+'。</span>');

    const period=date.slice(0,7);
    const um=prevMonthOf(period);
    const rb=rentByDays(rid,period,date);
    const u=utilOf(rid,period,date);
    const p=u.p;
    const t=primaryTenant(rid);
    const dep=t&&t.deposit!=null&&t.deposit!==''?num(t.deposit):(p.deposit||0);
    const gf=money(p.garbageFee),nf=money(p.netFee*rb.days/rb.total);
    const mf=money((p.mgmtFee||0)*rb.days/rb.total),pf=money((p.parkFee||0)*rb.days/rb.total),ef=money((p.extraFee||0)*rb.days/rb.total);
    const prevBill=state.bills.find(b=>b.roomId===rid&&b.utilMonth===um&&b.settle!=='depart');
    let pu=null,prevUtilCost=0;
    if(!prevBill||prevBill.status!=='已缴'){pu=utilOf(rid,um);prevUtilCost=money(pu.wCost+pu.eCost+pu.p.garbageFee+pu.p.netFee);}
    const idx0=state.bills.findIndex(b=>b.roomId===rid&&b.period===period);
    const prevPaid=idx0>=0&&state.bills[idx0].status==='已缴';
    const userRemark=ov.querySelector('[name=remark]').value.trim()||'退租结算';
    const bill={id:uid(),roomId:rid,period,tenantName:t?t.name:'',
      rentMonth:period,utilMonth:period,settle:'depart',
      prevWater:u.w.prev?u.w.prev.reading:(u.w.curr&&u.w.curr.base!=null&&u.w.curr.base!==''?u.w.curr.base:null),currWater:u.w.curr?u.w.curr.reading:null,waterUsage:u.wUsage,waterCost:u.wCost,waterNote:u.wNote||'',
      prevElec:u.e.prev?u.e.prev.reading:(u.e.curr&&u.e.curr.base!=null&&u.e.curr.base!==''?u.e.curr.base:null),currElec:u.e.curr?u.e.curr.reading:null,elecUsage:u.eUsage,elecCost:u.eCost,elecNote:u.eNote||'',
      prevUtilCost:prevPaid?0:prevUtilCost,prevUtilMonth:prevPaid?'':um,prevUtilNote:prevPaid?'':(pu?('水 '+moneyFmt(pu.wCost)+' / 电 '+moneyFmt(pu.eCost)+' / 垃圾 '+moneyFmt(pu.p.garbageFee)+' / 网络 '+moneyFmt(pu.p.netFee)):''),
      rent:prevPaid?0:rb.rent,rentDays:prevPaid?0:rb.days,rentDaysTotal:rb.total,
      deposit:-dep,garbageFee:gf,netFee:nf,mgmtFee:mf,parkFee:pf,extraFee:ef,
      otherFee:0,otherName:'',
      dueDate:date,
      remark:userRemark+' · 结清至 '+date+(prevPaid?'（房租及上月杂费已在已缴账单，本单仅结算本月杂费）':(prevUtilCost>0?' · 含上月未缴杂费':'')),
      status:'未缴',createdAt:new Date().toISOString()};
    const owed=money(num(bill.waterCost)+num(bill.elecCost)+num(bill.rent)+num(bill.garbageFee)+num(bill.netFee)+num(bill.mgmtFee)+num(bill.parkFee)+num(bill.extraFee)+num(bill.otherFee)+num(bill.prevUtilCost));
    bill.total=money(dep-owed);
    const idx=state.bills.findIndex(b=>b.roomId===rid&&b.period===period);
    if(idx>=0&&!prevPaid)state.bills[idx]=bill;else state.bills.push(bill);
    const room=getRoom(rid);
    if(room&&room.status!=='退租')room.status='退租';
    if(t&&t.status!=='已退租'){t.status='已退租';t.leaseEnd=date;}
    save();closeModal(ov);drawBills();toast('已生成 '+roomNo(rid)+' 退租结算账单：'+moneyFmt(bill.total),'ok');
    showBill(bill.id);
  };
}

function billToText(b){
  const r=getRoom(b.roomId);
  const um=monthLabel(b.utilMonth||b.period);
  const rm=monthLabel(b.period);
  const L=[];
  const gap=()=>{if(L.length&&L[L.length-1]!=='')L.push('');};
  L.push('【'+(b.settle==='depart'?'退租结算账单':'费用账单')+'】'+esc(r?r.no:'')+' 房 · '+rm);
  L.push('租客：'+esc(b.tenantName||'—'));
  L.push('————————————');
  if(num(b.rent)>0)L.push('房租（'+rm+'）：'+moneyFmt(b.rent)+(b.rentDays&&b.rentDaysTotal&&b.rentDays<b.rentDaysTotal?'（按 '+b.rentDays+'/'+b.rentDaysTotal+' 天）':''));
  const wd=(b.waterUsage!=null)?meterBillDetail(state.water,b.roomId,b.utilMonth||b.period,b,'吨','water'):'';
  const ed=(b.elecUsage!=null)?meterBillDetail(state.elec,b.roomId,b.utilMonth||b.period,b,'度','elec'):'';
  if(b.waterUsage!=null){gap();L.push('水费（'+um+'）：上月读数 '+(b.prevWater!=null?b.prevWater+'吨':'—')+' → 本月读数 '+(b.currWater!=null?b.currWater+'吨':'—')+(b.waterNote?'（'+noteWithUnit(b.waterNote,' 吨')+'）':'')+(wd?'【'+wd+'】':'')+'，用水 '+b.waterUsage+'吨 × '+moneyFmt(num(b.waterCost)/(num(b.waterUsage)||1))+' = '+moneyFmt(b.waterCost));}
  if(b.elecUsage!=null){gap();L.push('电费（'+um+'）：上月读数 '+(b.prevElec!=null?b.prevElec+'度':'—')+' → 本月读数 '+(b.currElec!=null?b.currElec+'度':'—')+(b.elecNote?'（'+noteWithUnit(b.elecNote,' 度')+'）':'')+(ed?'【'+ed+'】':'')+'，用电 '+b.elecUsage+'度 × '+moneyFmt(num(b.elecCost)/(num(b.elecUsage)||1))+' = '+moneyFmt(b.elecCost));}
  const hasOther=num(b.deposit)>0||(b.settle==='depart'&&num(b.deposit)<0)||num(b.garbageFee)>0||num(b.netFee)>0||num(b.mgmtFee)>0||num(b.parkFee)>0||num(b.extraFee)>0||num(b.prevUtilCost)>0||num(b.otherFee)>0;
  if(hasOther)gap();
  if(num(b.deposit)>0)L.push('押金：'+moneyFmt(b.deposit));
  if(b.settle==='depart'&&num(b.deposit)<0)L.push('押金抵扣：−'+moneyFmt(-num(b.deposit)));
  if(num(b.garbageFee)>0)L.push('垃圾清洁费（'+um+'）：'+moneyFmt(b.garbageFee));
  if(num(b.netFee)>0)L.push('网络费（'+um+'）：'+moneyFmt(b.netFee));
  if(num(b.mgmtFee)>0)L.push('物业管理费（'+rm+'）：'+moneyFmt(b.mgmtFee));
  if(num(b.parkFee)>0)L.push('停车费（'+rm+'）：'+moneyFmt(b.parkFee));
  if(num(b.extraFee)>0)L.push('其他费用（'+rm+'）：'+moneyFmt(b.extraFee));
  if(num(b.prevUtilCost)>0)L.push('上月杂费（'+monthLabel(b.prevUtilMonth||b.period)+'，未缴累积）：'+moneyFmt(b.prevUtilCost)+(b.prevUtilNote?'（'+b.prevUtilNote+'）':''));
  if(num(b.otherFee)>0)L.push((b.otherName?esc(b.otherName)+'（'+um+'）：':'其他费用：')+moneyFmt(b.otherFee));
  gap();
  L.push('————————————');
  if(b.settle==='depart'){
    const owed=money(num(b.waterCost)+num(b.elecCost)+num(b.rent)+num(b.garbageFee)+num(b.netFee)+num(b.mgmtFee)+num(b.parkFee)+num(b.extraFee)+num(b.otherFee)+num(b.prevUtilCost));
    L.push('应付合计：'+moneyFmt(owed));
    L.push('押金抵扣：−'+moneyFmt(-num(b.deposit)));
    L.push('应退（押金−应付）：'+moneyFmt(b.total)+'（大写：人民币 '+fmtAmountCN(Math.abs(num(b.total)))+(num(b.total)<0?' 负':'')+'）'+(num(b.total)<0?'（租客需补缴）':'（应退还租客）'));
  }else{
    L.push('合计：'+moneyFmt(b.total)+'（大写：人民币 '+fmtAmountCN(b.total)+'）');
  }
  L.push('状态：'+(b.status==='已缴'?(b.settle==='depart'?'已结算':'已缴费'):(b.settle==='depart'?'未结算':'未缴费')));
  if(b.dueDate)L.push('到期日：'+esc(b.dueDate));
  if(b.remark)L.push('备注：'+esc(b.remark));
  if(b.status!=='已缴')L.push('缴费方式：支持微信 / 支付宝 / 银行转账，转账记录作为已缴凭证。');
  L.push('计费规则：当月房租 + 上月水电杂费'+(b.status==='已缴'?'，已缴清，谢谢合作。':'，请于到期日前缴纳，谢谢合作。'));
  return L.join('\n');
}
function noteWithUnit(note,unit){return note&&!/[吨度]$/.test(note)?note+unit:note;}
function copyText(text,okMsg){
  const done=()=>toast(okMsg||'已复制','ok');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{fallbackCopy(text);done();});
  }else{fallbackCopy(text);done();}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  ta.remove();
}
function exportBillImage(b){

  toast('正在生成图片…');
  document.fonts.ready.then(()=>{
    html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}).then(canvas=>{
      canvas.toBlob(blob=>{
        if(!blob){toast('图片生成失败','err');return;}
        downloadBlob(blob,'账单-'+esc(roomNo(b.roomId))+'-'+b.period+'.png');
        toast(isIOS()?'已打开分享面板，选择「存储图像」可存到相册':'账单图片已导出，可直接发送给租客','ok');
      },'image/png');
    }).catch(()=>toast('图片生成失败，请重试','err'));
  });
}
function meterBillDetail(list,roomId,period,b,unit,kind){
  kind=kind||'water';
  const use=kind==='water'?(b.currWaterUsage!=null?b.currWaterUsage:b.waterUsage):(b.currElecUsage!=null?b.currElecUsage:b.elecUsage);
  const recs=list.filter(x=>x.roomId===roomId&&x.date>=period+'-01'&&x.date<=period+'-31').sort((a,b2)=>a.date<b2.date?-1:1);
  const reset=recs.find(x=>x.event===RESET_EVENT);
  if(reset){
    const prev=lastReadingBefore(list,roomId,period+'-01');
    const base=reset.base!=null&&reset.base!==''?num(reset.base):0;
    const last=recs[recs.length-1];
    const lines=[];
    if(prev)lines.push('上月读数（旧表）'+num(prev.reading)+' → 换表日旧表最终读数 '+num(reset.reading)+'，换表前用量 '+money(num(reset.reading)-num(prev.reading))+unit);
    else lines.push('上月无读数（旧表），换表日旧表最终读数 '+num(reset.reading)+' 即换表前用量');
    if(last&&last.date>reset.date)lines.push('新表起始读数 '+base+' → 月底读数 '+num(last.reading)+'，换表后用量 '+money(num(last.reading)-base)+unit);
    lines.push('当月合计 '+(use!=null?use:'—')+unit+' = '+(kind==='water'?b.waterNote:b.elecNote||''));
    return lines.join('；');
  }
  const prevRec=lastReadingBefore(list,roomId,period+'-01');
  const pv=kind==='water'?b.prevWater:b.prevElec;
  const cv=kind==='water'?b.currWater:b.currElec;
  if(!prevRec&&cv!=null&&use!=null){
    return '上月无读数'+(pv!=null&&pv!==''?'，'+pv+' 为期初读数':'')+'；本月用量 = 本月读数 '+cv+(pv!=null&&pv!==''?' − '+pv:'')+' = '+use+unit;
  }
  return null;
}

function batchExportBillImages(){
  if(typeof html2canvas==='undefined'){toast('图片导出组件未载入（需联网），可改用「整体导出」备份','err');return;}
  const years=[...new Set(state.bills.map(b=>b.period.slice(0,4)))].sort().reverse();
  const months=[...new Set(state.bills.map(b=>b.period))].sort().reverse();
  const body='<div class="fgrid">'
    +'<div class="fld full"><label>导出范围</label><select id="beRange"><option value="all">全部账单</option>'
    +(years.length?'<option value="year">按年导出</option>':'')
    +(months.length?'<option value="month">按月导出</option>':'')
    +'</select></div>'
    +(years.length?'<div class="fld" id="beYearBox" style="display:none"><label>选择年份</label><select id="beYear">'+years.map(y=>'<option>'+y+'</option>').join('')+'</select></div>':'')
    +(months.length?'<div class="fld" id="beMonthBox" style="display:none"><label>选择收款月份</label><select id="beMonth">'+months.map(m=>'<option value="'+m+'">'+monthLabel(m)+'</option>').join('')+'</select></div>':'')
    +'<div class="fld full"><label class="check"><input type="checkbox" id="beAllStatus" checked> 包含已缴费与未缴费的全部账单</label></div>'
    +'<div style="font-size:12px;color:var(--text-3);line-height:1.8">逐张生成账单图片后打包成 ZIP 一次性下载；手机保存到文件后解压即可逐张发送。账单较多时生成需要一点时间。</div>'
    +'</div>';
  const ov=openModal(modalShell('批量导出账单图片',body,'<button class="btn" data-close>取消</button><button class="btn primary" id="beGo">'+ic('down')+'开始导出</button>'));
  const rg=ov.querySelector('#beRange'),yb=ov.querySelector('#beYearBox'),mb=ov.querySelector('#beMonthBox');
  if(rg)rg.addEventListener('change',()=>{if(yb)yb.style.display=rg.value==='year'?'':'none';if(mb)mb.style.display=rg.value==='month'?'':'none';});
  ov.querySelector('#beGo').onclick=()=>{
    const range=rg?rg.value:'all';
    const year=ov.querySelector('#beYear')?ov.querySelector('#beYear').value:'';
    const month=ov.querySelector('#beMonth')?ov.querySelector('#beMonth').value:'';
    let list=state.bills.slice();
    if(range==='year')list=list.filter(b=>b.period.startsWith(year));
    if(range==='month')list=list.filter(b=>b.period===month);
    if(!ov.querySelector('#beAllStatus').checked)list=list.filter(b=>b.status==='未缴');
    if(!list.length){toast('没有符合条件的账单','err');return;}
    closeModal(ov);
    const host=document.createElement('div');
    host.style.cssText='position:fixed;left:-9999px;top:0;width:760px;z-index:-1';
    document.body.appendChild(host);
    const entries=[];
    toast('正在生成 0 / '+list.length+'…');
    (async()=>{
      for(let i=0;i<list.length;i++){
        const b=list[i];
        host.innerHTML=billSheetHTML(b);
        await document.fonts.ready;
        try{
          const canvas=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
          const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
          if(blob)entries.push({name:'账单-'+roomNo(b.roomId)+'-'+b.period+(b.tenantName?'-'+b.tenantName:'')+'.png',data:new Uint8Array(await blob.arrayBuffer())});
        }catch(e){}
        if((i+1)%3===0||i===list.length-1)toast('正在生成 '+(i+1)+' / '+list.length+'…');
      }
      host.remove();
      if(!entries.length){toast('没有生成任何图片','err');return;}
      downloadBlob(new Blob([zipStore(entries)],{type:'application/zip'}),'账单图片'+(range==='year'?'-'+year+'年':range==='month'?'-'+monthLabel(month):'')+'-'+todayStr()+'.zip');
      toast('已导出 '+entries.length+' 张账单图片（ZIP）','ok');
    })();
  };
}

    {key:'tenant',label:'租客',w:'12%',render:b=>esc(b.tenantName||'—')},

    {key:'w',label:'水费',w:'11%',align:'r',render:b=>'<span class="num">'+moneyFmt(b.waterCost)+'</span>'},
    {key:'e',label:'电费',w:'11%',align:'r',render:b=>'<span class="num">'+moneyFmt(b.elecCost)+'</span>'},
    {key:'gf',label:'垃圾清洁费',w:'12%',align:'r',render:b=>b.garbageFee?'<span class="num">'+moneyFmt(b.garbageFee)+'</span>':'—'},
    {key:'nf',label:'网络费',w:'10%',align:'r',render:b=>b.netFee?'<span class="num">'+moneyFmt(b.netFee)+'</span>':'—'},
    {key:'ot',label:'其他',w:'10%',align:'r',render:b=>b.otherFee?'<span class="num">'+moneyFmt(b.otherFee)+'</span>':'—'},
    {key:'tt',label:'合计',w:'14%',align:'r',render:b=>'<b class="num">'+moneyFmt(b.total)+'</b>'}

  const ig=document.getElementById('balIncome');
  renderGrid(ig,incCols,incBills.map(b=>Object.assign({},b,{_id:b.id})),{emptyText:'本月暂无已缴费账单，缴费后自动计入收入',emptyIcon:'coin'});
  if(incBills.length){
    const tb=ig.querySelector('tbody');
    const tr=document.createElement('tr');

    tr.innerHTML='<td colspan="2">收入合计</td><td class="r">'+moneyFmt(incBills.reduce((s,b)=>s+num(b.rent),0))+'</td><td class="r">'+moneyFmt(incBills.reduce((s,b)=>s+num(b.waterCost),0))+'</td><td class="r">'+moneyFmt(incBills.reduce((s,b)=>s+num(b.elecCost),0))+'</td><td class="r">'+moneyFmt(incBills.reduce((s,b)=>s+num(b.garbageFee),0))+'</td><td class="r">'+moneyFmt(incBills.reduce((s,b)=>s+num(b.netFee),0))+'</td><td class="r">'+moneyFmt(incBills.reduce((s,b)=>s+num(b.otherFee),0))+'</td><td class="r">'+moneyFmt(incTotal)+'</td>';

  const catBox=document.getElementById('expCats');

  eg.querySelectorAll('[data-xid]').forEach(c=>c.addEventListener('click',()=>expenseDetail(c.dataset.xid)));

function drawBalanceChart(month){
  const el=document.getElementById('balChart');
  if(!el)return;
  const months=[];
  const d=new Date();
  for(let i=5;i>=0;i--){
    const dt=new Date(d.getFullYear(),d.getMonth()-i,1);
    months.push(dt.getFullYear()+'-'+pad2(dt.getMonth()+1));
  }
  const inc=months.map(m=>state.bills.filter(b=>b.period===m&&b.status==='已缴'&&b.settle!=='depart').reduce((s,b)=>s+num(b.total),0));
  const exp=months.map(m=>state.expenses.filter(x=>String(x.date).startsWith(m)).reduce((s,x)=>s+num(x.amount),0));
  if(typeof echarts==='undefined'){
    el.innerHTML='<div class="chart-fallback">图表库未载入（需联网），请查看下方表格。</div>';
    return;
  }
  const chart=initChart(el);
  chart.setOption({
    grid:{left:60,right:20,top:30,bottom:28},
    tooltip:{trigger:'axis',valueFormatter:v=>'¥'+Number(v||0).toLocaleString('zh-HK',{minimumFractionDigits:2})},
    legend:{data:['收入','支出'],top:0,icon:'roundRect',itemWidth:12,itemHeight:8},
    xAxis:{type:'category',data:months.map(monthLabel),axisLine:{lineStyle:{color:'#D3DAE4'}},axisLabel:{color:'#54657A'}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#EDF0F4'}},axisLabel:{color:'#8B98A8'}},
    series:[
      {name:'收入',type:'bar',data:inc,barWidth:'30%',itemStyle:{color:'#15803D',borderRadius:[4,4,0,0]}},
      {name:'支出',type:'bar',data:exp,barWidth:'30%',itemStyle:{color:'#C4453F',borderRadius:[4,4,0,0]}}
    ]
  });
}

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function downloadBlob(blob,name){
  // iOS Safari 不支持 a[download] 保存 blob，改用系统分享面板（图片可存相册）
  if(isIOS()&&navigator.share&&navigator.canShare){
    var f=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:name}).catch(function(){});
      return;
    }
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
}
function downloadJSON(name,obj){
  downloadBlob(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),name);
}
function readJSONFile(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{try{res(JSON.parse(fr.result));}catch(e){rej(e);}};fr.onerror=rej;fr.readAsText(file);});
}

    return;

function importAll(file){
  if(!file)return;
  const isZip=file.name.toLowerCase().endsWith('.zip')||file.type==='application/zip'||file.type==='application/x-zip-compressed';
  if(isZip){
    file.arrayBuffer().then(buf=>{
      const entries=unzipStore(buf);
      const jIdx=entries.findIndex(e=>e.name==='出租屋数据.json'||e.name.endsWith('/出租屋数据.json'));
      if(jIdx<0){toast('压缩包中未找到「出租屋数据.json」，请使用本系统「整体导出」生成的备份','err');return;}
      let data;
      try{data=JSON.parse(new TextDecoder().decode(entries[jIdx].data));}catch(e){toast('数据文件解析失败','err');return;}
      const d=(data&&data.type==='all'&&data.data)?data.data:data;
      if(!d||typeof d!=='object'||!Array.isArray(d.rooms)){toast('数据文件格式不正确','err');return;}
      const imgEntries=entries.filter((e,i)=>i!==jIdx&&e.data.length);
      importAllDialog(d,imgEntries);
    }).catch(()=>toast('无法解析压缩包','err'));
    return;
  }
  readJSONFile(file).then(data=>{
    const d=(data&&data.type==='all'&&data.data)?data.data:data;
    if(!d||typeof d!=='object'||!Array.isArray(d.rooms)){toast('文件格式不正确：应为本系统导出的全量备份','err');return;}
    importAllDialog(d,null);
  }).catch(()=>toast('无法解析 JSON 文件','err'));
}

    {id:'t1',name:'陈大文',phone:'9123 4567',idcard:'A123456(7)',roomId:'r101',role:'承租人',leaseStart:mk(now.getFullYear(),now.getMonth()-2,1),leaseEnd:mk(now.getFullYear()+1,now.getMonth()-2,30),deposit:2000,status:'在住',remark:''},
    {id:'t2',name:'李小明',phone:'9234 5678',idcard:'B234567(8)',roomId:'r102',role:'承租人',leaseStart:mk(now.getFullYear(),now.getMonth()-5,15),leaseEnd:mk(now.getFullYear()+1,now.getMonth()-5,14),deposit:2500,status:'在住',remark:'两人合租'},
    {id:'t3',name:'张美玲',phone:'9345 6789',idcard:'C345678(9)',roomId:'r202',role:'承租人',leaseStart:mk(now.getFullYear(),now.getMonth()-8,1),leaseEnd:mk(now.getFullYear(),now.getMonth()-1,20),deposit:2000,status:'已退租',remark:'8月20日退租，押金结算'}
  ];
  tenants.forEach(t=>{if(!state.tenants.some(x=>x.id===t.id))state.tenants.push(t);});
  if(!state.prices.some(p=>!p.roomId)){
    state.prices.push({id:'pg',roomId:'',month:'2026-01',waterPrice:4.5,elecPrice:1.2,rent:1500,deposit:2000,garbageFee:20,netFee:30,remark:'全局默认'});
  }
  if(!state.prices.some(p=>p.roomId==='r102')){
    state.prices.push({id:'p102',roomId:'r102',month:'2026-01',waterPrice:'',elecPrice:'',rent:2200,deposit:'',garbageFee:'',netFee:'',remark:'两房单价'});
  }
  const readings=[];
  const y=now.getFullYear(),mo=now.getMonth()+1;
  const mkDate=(off)=>new Date(y,mo-1-off,5);
  // 过去 4 个月每月 5 日抄表（6 月 ~ 9 月）
  for(let off=3;off>=0;off--){
    const dt=mkDate(off);
    const ds=fmtDate(dt);
    readings.push({type:'w',roomId:'r101',date:ds,reading:[0,20,42,64][3-off],event:'normal',remark:''});
    readings.push({type:'e',roomId:'r101',date:ds,reading:[0,150,330,510][3-off],event:'normal',remark:''});
    readings.push({type:'w',roomId:'r102',date:ds,reading:[7,35,63,91][3-off],event:'normal',remark:''});
    readings.push({type:'e',roomId:'r102',date:ds,reading:[20,230,440,650][3-off],event:'normal',remark:''});
    if(off===2){readings.push({type:'e',roomId:'r202',date:ds,reading:360,event:'normal',remark:''});}
    if(off===1){readings.push({type:'e',roomId:'r202',date:ds,reading:420,event:RESET_EVENT,remark:'旧表最终读数，换新表'});}
    if(off===0){readings.push({type:'e',roomId:'r202',date:ds,reading:36,event:'normal',remark:'新表'});}
    if(off===0){readings.push({type:'w',roomId:'r201',date:ds,reading:0,event:'normal',remark:'新表初装'});}
  }
  readings.forEach(r=>{
    const k=r.type==='w'?'water':'elec';
    if(!state[k].some(x=>x.roomId===r.roomId&&x.date===r.date&&x.event===r.event)){
      state[k].push({id:uid(),roomId:r.roomId,date:r.date,reading:r.reading,event:r.event,remark:r.remark,createdAt:new Date().toISOString()});
    }
  });
  const period=currentMonth();
  const prevPeriod=prevMonthOf(period);
  if(!state.bills.some(b=>b.period===period&&b.roomId==='r101')){
    const p=priceOf('r101');
    state.bills.push({id:uid(),roomId:'r101',period,tenantName:'陈大文',
      rentMonth:period,utilMonth:prevPeriod,
      prevWater:20,currWater:42,waterUsage:22,waterCost:money(22*p.waterPrice),prevWaterUsage:20,currWaterUsage:22,
      prevElec:150,currElec:330,elecUsage:180,elecCost:money(180*p.elecPrice),prevElecUsage:150,currElecUsage:180,
      rent:p.rent,rentDays:daysInMonthOf(period),rentDaysTotal:daysInMonthOf(period),deposit:0,garbageFee:p.garbageFee,netFee:p.netFee,
      otherFee:0,otherName:'',
      dueDate:period+'-05',remark:'',status:'未缴',createdAt:new Date().toISOString()});
  }
  if(!state.bills.some(b=>b.period===prevPeriod&&b.roomId==='r101')){
    const p=priceOf('r101');
    state.bills.push({id:uid(),roomId:'r101',period:prevPeriod,tenantName:'陈大文',
      rentMonth:prevPeriod,utilMonth:prevMonthOf(prevPeriod),
      prevWater:0,currWater:20,waterUsage:20,waterCost:money(20*p.waterPrice),prevWaterUsage:null,currWaterUsage:20,
      prevElec:0,currElec:150,elecUsage:150,elecCost:money(150*p.elecPrice),prevElecUsage:null,currElecUsage:150,
      rent:p.rent,rentDays:daysInMonthOf(prevPeriod),rentDaysTotal:daysInMonthOf(prevPeriod),deposit:p.deposit,garbageFee:p.garbageFee,netFee:p.netFee,
      otherFee:0,otherName:'',
      dueDate:prevPeriod+'-05',remark:'首月含押金',status:'已缴',createdAt:new Date().toISOString()});
  }
  if(!state.bills.some(b=>b.period===prevPeriod&&b.roomId==='r202'&&b.settle==='depart')){
    const p=priceOf('r202');
    const dd=prevPeriod+'-20';
    const days=20,total=daysInMonthOf(prevPeriod);
    const rent=money(p.rent*days/total);
    const dep=2000;
    state.bills.push({id:uid(),roomId:'r202',period:prevPeriod,tenantName:'张美玲',
      rentMonth:prevPeriod,utilMonth:prevPeriod,settle:'depart',
      prevWater:null,currWater:null,waterUsage:0,waterCost:0,prevWaterUsage:null,currWaterUsage:0,
      prevElec:360,currElec:420,elecUsage:60,elecCost:money(60*p.elecPrice),prevElecUsage:null,currElecUsage:60,
      rent,rentDays:days,rentDaysTotal:total,deposit:-dep,garbageFee:money(p.garbageFee),netFee:money(p.netFee*days/total),
      otherFee:0,otherName:'',
      dueDate:dd,remark:'退租结算 · 结清至 '+dd+'（押金抵扣 −'+moneyFmt(dep)+'）',status:'未缴',createdAt:new Date().toISOString()});
  }
  state.bills.forEach(b=>{
    const owe=money(num(b.waterCost)+num(b.elecCost)+num(b.rent)+num(b.deposit)+num(b.garbageFee)+num(b.netFee)+num(b.otherFee));
    b.total=b.settle==='depart'?money(-owe):owe;
  });
  // 示例总表记录：总表与分表对比
  if(!state.meters.length){
    state.meters.push({id:uid(),type:'w',period:prevPeriod,reading:810,actualPaid:280,remark:'8月水费'});
    state.meters.push({id:uid(),type:'e',period:prevPeriod,reading:6400,actualPaid:950,remark:'8月电费'});
    state.meters.push({id:uid(),type:'w',period,reading:880,actualPaid:320,remark:'9月水费'});
    state.meters.push({id:uid(),type:'e',period,reading:7200,actualPaid:1000,remark:'9月电费'});
  }
  // 示例支出：上个月缴纳的水电费与房屋维护开支（与已缴账单对应，体现收支平衡）
  if(!state.expenses.length){
    const d=(day)=>prevPeriod+'-'+day;
    state.expenses.push({id:uid(),date:d(10),category:'水费',amount:180,roomId:'',remark:'水务公司代缴'});
    state.expenses.push({id:uid(),date:d(18),category:'电费',amount:520,roomId:'',remark:'供电局代缴'});
    state.expenses.push({id:uid(),date:d(20),category:'清洁费',amount:120,roomId:'',remark:'公共区域月度清洁'});
    state.expenses.push({id:uid(),date:d(24),category:'维修费',amount:80,roomId:'r202',remark:'卫生间水龙头更换'});
    state.expenses.push({id:uid(),date:d(28),category:'设备更换',amount:350,roomId:'r201',remark:'更换新热水器'});
  }
}

/* ============ 初始化 ============ */
function init(){
  openDocDB();
  buildNav();
  const hash=location.hash.replace('#','');
  navigate(hash||'overview');
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTopModal();});
  // 延迟载入 ECharts
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js';
  s.onload=()=>{if(currentView==='overview')renderTrend();if(currentView==='summary')drawSummary();if(currentView==='meters')drawMasterMeters();if(currentView==='balance')drawBalance();};
  s.onerror=()=>{};
  document.head.appendChild(s);
  // 延迟载入 html2canvas（账单导出图片）
  const h2=document.createElement('script');
  h2.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  h2.onerror=()=>{};
  document.head.appendChild(h2);
}
init();
</script>
