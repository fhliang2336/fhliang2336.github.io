<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出租屋管理系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7A6E'/%3E%3Cpath d='M8 25V13l8-6 8 6v12h-5v-7h-6v7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap">
<style>
/* ============ Design Tokens ============ */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --line:#E4E9F0; --line-2:#D3DAE4;
  --text:#1B2634; --text-2:#54657A; --text-3:#8B98A8;
  --primary:#0E7A6E; --primary-2:#0A5F55; --primary-bg:#E2F1EE;
  --amber:#B45309; --amber-bg:#FDF1DC;
  --danger:#C4453F; --danger-bg:#FBEAE9;
  --ok:#15803D; --ok-bg:#E2F4E8;
  --info:#2563EB; --info-bg:#E8EFFD;
  --teal:#0F766E; --cyan:#0891B2; --orange:#D97706;
  --radius:10px; --radius-s:7px;
  --shadow:0 1px 2px rgba(18,28,42,.05),0 4px 16px rgba(18,28,42,.06);
  --shadow-lg:0 8px 40px rgba(18,28,42,.16);
  --sidebar-w:236px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","SF Mono",Consolas,"Noto Sans TC",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
input::placeholder,textarea::placeholder{color:#A9B4C0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C9D2DD;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#AAB6C4;background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

/* ============ App Shell ============ */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(14,122,110,.35)}
.brand .logo svg{width:20px;height:20px}
.brand b{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-size:11px;color:var(--text-3);font-weight:400;margin-top:-1px}
#nav{flex:1;overflow-y:auto;padding:10px 8px 14px}
.nav-group{font-size:11px;color:var(--text-3);padding:10px 10px 5px;font-weight:600;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);font-size:13.5px;cursor:pointer;margin-bottom:2px;user-select:none;transition:background .12s,color .12s}
.nav-item:hover{background:#EEF2F6;color:var(--text)}
.nav-item.active{background:var(--primary-bg);color:var(--primary-2);font-weight:600}
.nav-item .ic{width:17px;height:17px;flex:none;display:flex;align-items:center;justify-content:center}
.nav-item .ic svg{width:15px;height:15px}
.nav-item .cnt{margin-left:auto;font-size:11px;background:#EEF1F5;color:var(--text-3);border-radius:20px;padding:1px 8px;font-weight:600}
.nav-item.active .cnt{background:#fff;color:var(--primary-2)}
#sidebar-foot{padding:10px 16px 4px;font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:7px}
#sidebar-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
#saveState{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-credit{padding:8px 14px 14px;font-size:10.5px;color:var(--text-3);text-align:center;line-height:1.6;flex:none}
#saveState{transition:opacity .5s}

/* ============ Main ============ */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#view-host{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.view-head{padding:20px 26px 14px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.view-head .t{flex:1;min-width:200px}
.view-head h1{font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.view-head h1 .vh-ic{width:19px;height:19px;color:var(--primary)}
.view-head p{color:var(--text-3);font-size:12.5px;margin-top:2px}
.view-head .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.view-body{padding:18px 26px 40px;flex:1}
.ov-body{padding-bottom:0}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);transition:all .13s;white-space:nowrap}
.btn:hover{border-color:#B9C4D1;color:var(--text);background:#FAFBFD}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn.danger{color:var(--danger);border-color:#E3B9B6;background:#FEF6F5}
.btn.danger:hover{background:var(--danger-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#EEF2F6}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ Toolbar / Search ============ */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3);pointer-events:none}
.search input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);outline:none;transition:border .13s,box-shadow .13s}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,122,110,.13)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters select{padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);outline:none;font-size:13px}
.filters select:focus{border-color:var(--primary)}
.toolbar select,.toolbar input,.filters select,.filters input{height:34px;box-sizing:border-box;font-size:13px}
.toolbar input[type=month],.filters input[type=month]{padding:0 6px}

/* ============ Data Table ============ */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:62vh;box-shadow:var(--shadow)}
table.grid{width:100%;border-collapse:collapse;table-layout:auto;min-width:820px}
table.grid thead th{background:#F4F7FA;font-size:12px;font-weight:600;color:var(--text-2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.grid tbody td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;white-space:nowrap}
table.grid tbody tr:last-child td{border-bottom:none}
table.grid tbody tr:hover td{background:#F8FAFC}
table.grid tbody tr.row-click{cursor:pointer}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
table.grid th,table.grid td{text-align:left}
.empty-row td{padding:34px 12px;text-align:center;color:var(--text-3);font-size:13px}
.empty-row .e-ic{width:44px;height:44px;margin:0 auto 8px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:#B6C1CD}
.empty-row .e-ic svg{width:22px;height:22px}
.row-actions{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity .12s}
tr:hover .row-actions{opacity:1}
.row-actions .btn{padding:4px 8px}

/* badges & chips */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge .bd{width:6px;height:6px;border-radius:50%}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.ok .bd{background:var(--ok)}
.badge.warn{background:var(--amber-bg);color:var(--amber)} .badge.warn .bd{background:var(--amber)}
.badge.danger{background:var(--danger-bg);color:var(--danger)} .badge.danger .bd{background:var(--danger)}
.badge.gray{background:#EDF0F4;color:var(--text-3)} .badge.gray .bd{background:#A6B1BD}
.badge.info{background:var(--info-bg);color:var(--info)} .badge.info .bd{background:var(--info)}
.badge.teal{background:#D9F2EF;color:#0F766E} .badge.teal .bd{background:#0F766E}
.badge.purple{background:#F1E7FE;color:#7C3AED} .badge.purple .bd{background:#7C3AED}
.badge.blue{background:var(--info-bg);color:#1D4ED8} .badge.blue .bd{background:#1D4ED8}
.badge.green{background:#DCFCE7;color:#15803D} .badge.green .bd{background:#15803D}
.exp-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:2px 0 12px}
.exp-cat{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:all .13s;box-shadow:var(--shadow)}
.exp-cat:hover{border-color:var(--primary);transform:translateY(-1px)}
.exp-cat.on{background:var(--primary-bg);border-color:var(--primary)}
.exp-cat.total{background:var(--primary-bg);border-color:var(--primary);cursor:default;font-weight:700;grid-column:1/-1}
.exp-cat.total .ec-name{flex:1}
.exp-cat .ec-name{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;min-width:0}
.exp-cat .ec-amt{font-size:15px;font-weight:700;color:var(--text-1)}
.chip{display:inline-block;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);border-radius:6px;padding:1px 7px;font-size:11.5px;margin:1.5px 2px 1.5px 0;white-space:nowrap}
.link-btn{color:var(--primary);font-weight:600;cursor:pointer;background:none;border:none;padding:0;font-size:13px}
.link-btn:hover{text-decoration:underline}

/* ============ Stats Cards ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .s-label{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s-label svg{width:12px;height:12px;flex:none}
.stat .s-label .sic{display:inline-flex;align-items:center;flex:none}
.stat .s-val{font-size:24px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
.stat .s-val.sm{font-size:15px;line-height:1.4;letter-spacing:0}
.stat .s-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--tint,var(--primary-bg));opacity:.55}
.stat.clickable{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
.stat.clickable:hover{border-color:var(--primary);box-shadow:0 3px 14px rgba(14,122,110,.16);transform:translateY(-1px)}

/* ============ Modal ============ */
.overlay{position:fixed;inset:0;background:rgba(16,26,40,.42);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px 20px;opacity:0;pointer-events:none;transition:opacity .16s;overflow-y:auto;overscroll-behavior:contain}
body.modal-open{overflow:hidden}
.overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:620px;transform:translateY(8px) scale(.985);transition:transform .16s;margin-bottom:20px}
.overlay.open .modal{transform:none}
.modal.wide{max-width:860px}
.modal.xwide{max-width:1040px}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15.5px;font-weight:700;flex:1}
.modal-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.modal-close:hover{background:#EEF2F6;color:var(--text)}
.modal-body{padding:18px 20px;max-height:66vh;overflow-y:auto;overscroll-behavior:contain}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.modal-foot .btn{flex:0 1 auto;min-width:0;white-space:nowrap}
.modal-foot.bill-foot{justify-content:center;gap:8px}
.modal-foot.bill-foot .btn{flex:1 1 0;max-width:170px;justify-content:center}
@media (max-width:640px){
  .modal-foot.bill-foot .btn{flex:1 1 calc(50% - 8px);max-width:none}
  table.bill td{padding:8px 6px;font-size:12px}
  table.bill th{padding:7px 5px;font-size:11px;white-space:normal}
  .bill-amount .big{font-size:clamp(17px,5.4vw,27px)}
  .bill-amount .cap b{font-size:12px}
  .bill-top,.bill-meta,.bill-table-wrap,.bill-note,.bill-amount,.bill-foot{padding-left:14px;padding-right:14px}
}

/* ============ Forms ============ */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);outline:none;transition:border .13s,box-shadow .13s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,122,110,.13)}
.fld textarea{resize:vertical;min-height:62px}
.fld .hint{font-size:11.5px;color:var(--text-3);margin-top:4px}
.fld.inline{display:flex;align-items:center;gap:9px}
.fld.inline>label{margin:0;white-space:nowrap}
.fld label.check{display:inline-flex;margin-bottom:0}
/* 表单统一：所有标签（标题）在控件上方，内容在下方 */
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--primary)}
.chips-box{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.chips-box .opt{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;background:var(--surface);transition:all .12s}
.chips-box .opt.on{background:var(--primary-bg);border-color:var(--primary);color:var(--primary-2);font-weight:600}
.custom-chip-input{display:flex;gap:6px;margin-top:8px}
.custom-chip-input input{flex:1;max-width:190px;padding:5px 10px;border:1px solid var(--line-2);border-radius:20px;font-size:12.5px;outline:none}
.custom-chip-input input:focus{border-color:var(--primary)}

/* ============ Summary / Quick entry ============ */
.quick-entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.quick-entry .qe-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:10px;color:var(--primary-2)}
.quick-entry .qe-title svg{width:16px;height:16px}
.qe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.qe-grid .fld input{padding:7px 10px}
.last-read{font-size:11.5px;color:var(--text-3);margin-top:5px}
.last-read b{color:var(--primary-2);font-weight:700}
.scope-sel{padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:13px;outline:none}
.chart-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.chart-head h4{margin:0}
.addr-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04);margin-bottom:12px;overflow-x:auto;transition:border-color .15s,box-shadow .15s}.addr-card.clickable{cursor:pointer}.addr-card.clickable:hover{border-color:var(--primary);box-shadow:0 3px 14px rgba(14,122,110,.14)}
.addr-head{display:flex;align-items:center;gap:8px;font-size:14.5px;margin-bottom:8px}
.addr-rooms{margin-left:auto;font-size:12px;color:var(--text-3);background:var(--surface-2);padding:2px 10px;border-radius:99px}
.addr-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:660px}
.addr-tbl th,.addr-tbl td{border:1px solid var(--line);padding:6px 10px;text-align:right;white-space:nowrap}
.addr-tbl th{background:var(--surface-2);font-weight:600;color:var(--text-2);text-align:center}
.addr-tbl td:first-child{text-align:center;width:52px}
.bprev{font-size:10.5px;color:var(--text-3);margin-top:3px}
table.grid td input[type=number].bw,table.grid td input[type=number].be,table.grid td input[type=number].bwb,table.grid td input[type=number].beb{width:100%;min-width:64px;padding:6px 8px}

/* ============ Bill Sheet (专业账单) ============ */
.bill-sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden;max-width:760px;margin:0 auto}
.bill-top{display:flex;justify-content:space-between;gap:14px;padding:22px 26px 14px;border-bottom:2px solid var(--text)}
.bill-brand{display:flex;align-items:center;gap:12px}
.bill-brand .logo{width:40px;height:40px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.bill-brand .logo svg{width:22px;height:22px}
.bill-brand h2{font-size:19px;font-weight:900;letter-spacing:.5px}
.bill-brand p{font-size:11.5px;color:var(--text-2)}
.bill-title{text-align:right}
.bill-title h3{font-size:19px;font-weight:700;letter-spacing:2px;color:var(--text)}
.bill-title .no{font-size:11.5px;color:var(--text-3);margin-top:2px}
.bill-meta{display:flex;flex-wrap:wrap;gap:2px 24px;padding:15px 26px 8px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bill-meta .bm{display:flex;font-size:13px;padding:3px 0;flex:1 1 calc(50% - 12px);min-width:220px}
.bill-meta .bm span{color:var(--text-3);width:76px;flex:none}
.bill-meta .bm b{font-weight:600}
.bill-table-wrap{padding:16px 26px 6px;overflow-x:auto}
.bill-subtitle{font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.bill-subtitle::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--primary);display:inline-block}
table.bill{width:100%;border-collapse:collapse;table-layout:fixed}
table.bill th{font-size:12px;color:var(--text-2);background:#F4F7FA;border:1px solid var(--line-2);padding:8px 10px;text-align:right;font-weight:600}
table.bill th:first-child,table.bill th:nth-child(2){text-align:left}
table.bill td{border:1px solid var(--line);padding:9px 10px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
table.bill td:first-child,table.bill td:nth-child(2){text-align:left}
table.bill tr.sum td{background:#FBFCFE;font-weight:700}
table.bill tr.total td{background:var(--primary-bg);font-weight:800;font-size:14.5px;color:var(--primary-2)}
.bill-note{padding:10px 26px 4px;font-size:12px;color:var(--text-2)}
.bill-note .line{display:flex;gap:8px;padding:2px 0}
.bill-note .line i{color:var(--text-3);font-style:normal;width:70px;flex:none}
.bill-amount{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 26px 6px;padding:13px 16px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;position:relative}
.bill-amount .cap{font-size:12px;color:var(--text-2)}
.bill-amount .cap b{color:var(--text);font-weight:700;font-size:13px}
.bill-amount .big{font-size:27px;font-weight:900;color:var(--primary-2);letter-spacing:.5px;white-space:nowrap}

<script>
(async function(){
  const HASH='a7418ce276e80dfa2df5216888b749893a1f8289da22d9b5dc38b21748f56c53';
  async function sha(s){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function check(){
    const p=document.getElementById('gatePwd').value;
    const h=await sha(p);
    if(h===HASH){document.getElementById('gate').remove();}
    else{document.getElementById('gateErr').textContent='密码错误，请重试';}
  }
  document.getElementById('gateBtn').addEventListener('click',check);
  document.getElementById('gatePwd').addEventListener('keydown',e=>{if(e.key==='Enter')check();});
})();

function freshState(){
  return {
    meta:{name:'我的出租屋',phone:'',address:'',updatedAt:''},
    rooms:[],tenants:[],prices:[],water:[],elec:[],bills:[],meters:[],expenses:[]
  };
}
let state=freshState();
try{
  const raw=localStorage.getItem(LS_KEY);
  if(raw){const d=JSON.parse(raw); if(d&&d.meta){state=Object.assign(freshState(),d);let chg=false;
    (state.rooms||[]).forEach(r=>{if(r.status==='空置'){r.status='退租';chg=true;}});

    if(chg){state.meta.updatedAt=new Date().toISOString();try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
  }}
}catch(e){console.warn('load failed',e);}
let saveTimer=null;
function save(){
  state.meta.updatedAt=new Date().toISOString();
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){console.warn('保存失败',e);}
  const el=document.getElementById('saveState');
  if(el){
    el.textContent='已自动保存 '+fmtTime(new Date());
    el.style.opacity='1';
    clearTimeout(el._t);
    el._t=setTimeout(()=>{if(el)el.style.opacity='0';},1800);
  }
  updateCounts();
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0;}
function money(v){return Math.round(num(v)*100)/100;}
function pad2(n){return String(n).padStart(2,'0');}
function fmtDate(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fmtTime(d){return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function todayStr(){return fmtDate(new Date());}
function currentMonth(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1);}
function monthLabel(m){const [y,mo]=m.split('-');return y+'年'+parseInt(mo,10)+'月';}
function lastDayOfMonth(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function moneyFmt(v){return '¥'+money(v).toLocaleString('zh-HK',{minimumFractionDigits:2,maximumFractionDigits:2});}

function fmtAmountCN(n){
  const cn='零壹贰叁肆伍陆柒捌玖',u=['','拾','佰','仟'];
  n=Math.round(Math.abs(num(n))*100); // 转为“分”
  if(!n)return '零元整';
  const yuan=Math.floor(n/100);
  const yi=Math.floor(yuan/1e8),wan=Math.floor(yuan%1e8/1e4),rest=yuan%1e4;
  let s='';
  function seg(v){
    let t='',zero=false;
    for(let i=0;i<4;i++){const d=Math.floor(v/Math.pow(10,3-i))%10;
      if(d===0){zero=t.length>0;} else {if(zero&&t)t+='零';t+=cn[d]+u[3-i];zero=false;}}
    return t;
  }
  if(yi){s+=seg(yi)+'亿';}
  if(wan){if(s&&wan<1000)s+='零';s+=seg(wan)+'万';}
  if(rest){if(s&&rest<1000)s+='零';s+=seg(rest);}
  const jiao=Math.floor(n/10)%10,fen=n%10;
  if(!s&&(jiao||fen))s='零';
  s+='元';
  if(jiao)s+=cn[jiao]+'角';
  if(fen)s+=cn[fen]+'分';
  if(!jiao&&!fen)s+='整';
  return s;
}

function renderGrid(container,cols,rows,opts){
  opts=opts||{};
  const colgroup=cols.map(c=>'<col style="width:'+(c.w||'auto')+'">').join('');
  const head='<tr>'+cols.map(c=>'<th class="'+(c.align==='r'?'r':c.align==='c'?'c':'')+'">'+c.label+'</th>').join('')+'</tr>';
  let body='';
  if(!rows.length){
    body='<tr class="empty-row"><td colspan="'+cols.length+'"><div class="e-ic">'+(ICONS[opts.emptyIcon||'doc']||'')+'</div>'+(opts.emptyText||'暂无数据')+'</td></tr>';
  }else{
    body=rows.map(r=>'<tr'+(r._click?' class="row-click"':'')+' data-id="'+esc(r._id||'')+'">'+cols.map(c=>{
      const v=c.render?c.render(r):r[c.key];
      return '<td class="'+(c.align==='r'?'r':c.align==='c'?'c':'')+'">'+(v==null||v===''?'—':v)+'</td>';
    }).join('')+'</tr>').join('');
  }
  container.innerHTML='<div class="table-wrap"><table class="grid"><colgroup>'+colgroup+'</colgroup><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  if(opts.onRowClick){
    container.querySelectorAll('tbody tr.row-click').forEach(tr=>{
      tr.addEventListener('click',()=>opts.onRowClick(tr.dataset.id));
    });
  }
  if(container.closest&&container.closest('.view-body'))fitTableWraps();
  return container.firstElementChild;
}
let _fitTick=false;
function fitTableWraps(){
  document.querySelectorAll('.view-body .table-wrap').forEach(w=>{
    const t=w.getBoundingClientRect().top;
    if(t>0&&t<window.innerHeight-60)w.style.maxHeight='calc(100vh - '+Math.round(t)+'px - 18px)';
  });
}
window.addEventListener('resize',()=>{if(_fitTick)return;_fitTick=true;setTimeout(()=>{_fitTick=false;fitTableWraps();},120);});
function rowActions(id,btns){
  const map={edit:['编辑','edit'],del:['删除','trash'],view:['查看','doc'],print:['打印','print'],pay:['标记已缴','check'],doc:['证件','doc']};
  return '<div class="row-actions">'+btns.map(b=>{
    const cfg=typeof b==='object'?b:{act:b};
    const [label,icn]=cfg.label?[cfg.label,'check']:map[cfg.act]||[cfg.act,'edit'];
    return '<button class="btn sm" data-act="'+cfg.act+'" data-id="'+id+'">'+(ICONS[icn]||'')+label+'</button>';
  }).join('')+'</div>';
}
function bindRowActions(container,handler){
  container.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();handler(btn.dataset.act,btn.dataset.id);});
  });
}

function openModal(html,opts){
  opts=opts||{};
  const host=document.getElementById('modal-host');
  document.body.classList.add('modal-open');
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML='<div class="modal '+(opts.wide?'wide':'')+(opts.xwide?'xwide':'')+'">'+html+'</div>';
  host.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('open'));
  ov.addEventListener('mousedown',e=>{if(e.target===ov&&!opts.static)closeModal(ov);});
  const closeBtn=ov.querySelector('.modal-close');
  if(closeBtn)closeBtn.addEventListener('click',()=>closeModal(ov));
  ov.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(ov)));
  return ov;
}
function closeModal(ov){
  if(!ov)return;
  ov.classList.remove('open');
  setTimeout(()=>{
    ov.remove();
    if(!document.querySelector('#modal-host .overlay'))document.body.classList.remove('modal-open');
  },170);
}
function closeTopModal(){const ovs=document.querySelectorAll('#modal-host .overlay');if(ovs.length)closeModal(ovs[ovs.length-1]);}

}

}

/* 范围筛选：按月 / 按年（值统一用 startsWith 匹配 period/date） */
function scopeHTML(selId,monId,yearId,defMonth,defMode){
  const by=defMode==='y';
  return '<select id="'+selId+'" class="scope-sel"><option value="m"'+(by?'':' selected')+'>按月</option><option value="y"'+(by?' selected':'')+'>按年</option></select>'
    +'<input type="month" id="'+monId+'" value="'+(defMonth||currentMonth())+'">'
    +'<input type="number" id="'+yearId+'" placeholder="年份" min="2000" max="2100" style="display:none;width:92px">';
}
function bindScope(selId,monId,yearId,cb){
  const s=document.getElementById(selId),m=document.getElementById(monId),y=document.getElementById(yearId);
  const sync=()=>{
    const ym=s&&s.value==='y';
    if(m)m.style.display=ym?'none':'';
    if(y)y.style.display=ym?'':'none';
    if(ym&&y&&!y.value)y.value=new Date().getFullYear();
    if(cb)cb();
  };
  if(s)s.addEventListener('change',sync);
  if(m)m.addEventListener('change',()=>cb&&cb());
  if(y)y.addEventListener('change',()=>cb&&cb());
  return sync;
}
function scopeVal(selId,monId,yearId){
  const s=document.getElementById(selId),m=document.getElementById(monId),y=document.getElementById(yearId);
  if(!s||!m||!y)return '';
  return s.value==='y'?String(y.value||''):m.value;
}

/* 身份证信息推断：18 位（15 位自动升位）→ 性别 / 出生日期 / 户籍省市（按前 6 位区划代码）；
   校验位不符时仍尽量带出信息（invalid=true），不因此拒绝识别 */
function idCheckOf(b17){
  const W=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2],M='10X98765432';
  let s=0;
  for(let i=0;i<17;i++)s+=+b17[i]*W[i];
  return M[s%11];
}
function inferIdno(id){
  id=String(id||'').trim()
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[Ｘｘ]/g,'X')
    .replace(/[^0-9Xx]/g,'');
  if(/^\d{15}$/.test(id))id=id.slice(0,6)+'19'+id.slice(6)+idCheckOf(id.slice(0,6)+'19'+id.slice(6));
  if(/^\d{17}$/.test(id))id=id+idCheckOf(id);
  if(!/^\d{17}[\dXx]$/.test(id))return null;
  const invalid=idCheckOf(id.slice(0,17))!==id[17].toUpperCase();
  const p2=id.slice(0,2),p4=id.slice(0,4);
  const city=GB_CITY[p4];
  let prov=GB_PROV[p2]||'';
  let addr='';
  if(prov){
    if(prov==='北京'||prov==='上海'||prov==='天津'||prov==='重庆')addr=prov+'市';
    else if(prov==='香港'||prov==='澳门')addr=prov+'特别行政区';
    else if(prov==='台湾')addr='台湾省';
    else addr=prov+'省';
    if(city&&!addr.startsWith(city))addr=addr+' '+city;
  }
  const b=id.slice(6,14);
  return {
    gender:(+id[16])%2===1?'男':'女',
    birth:b.slice(0,4)+'-'+b.slice(4,6)+'-'+b.slice(6,8),
    addr:addr||'',
    invalid:invalid
  };
}
/* ============ 关联与计费引擎 ============ */
function tenantsOfRoom(roomId){
  return state.tenants.filter(t=>t.roomId===roomId).sort((a,b)=>(a.role==='同住人'?1:0)-(b.role==='同住人'?1:0)||String(a.leaseStart||'').localeCompare(String(b.leaseStart||'')));
}
function primaryTenant(roomId){
  const list=tenantsOfRoom(roomId);
  const active=list.filter(t=>t.status==='在住');
  return (active.find(t=>(t.role||'承租人')==='承租人')||active[0]||list[0]||null);
}
function tenantNamesOf(roomId){
  const list=tenantsOfRoom(roomId).filter(t=>t.status==='在住');
  if(!list.length)return '';
  return list.map(t=>'<button class="link-btn" data-tenant="'+t.id+'">'+esc(t.name)+'</button>').join('、');
}
function priceOf(roomId, month){
  const eff=(rid)=>{
    const arr=state.prices.filter(p=>p.roomId===rid&&(!month||!p.month||p.month<=month));
    arr.sort((a,b)=>String(b.month||'').localeCompare(String(a.month||'')));
    return arr[0]||null;
  };
  const r=eff(roomId),g=eff('');
  return {
    waterPrice:r&&r.waterPrice!=null&&r.waterPrice!==''?num(r.waterPrice):(g&&g.waterPrice!=null&&g.waterPrice!==''?num(g.waterPrice):0),
    elecPrice:r&&r.elecPrice!=null&&r.elecPrice!==''?num(r.elecPrice):(g&&g.elecPrice!=null&&g.elecPrice!==''?num(g.elecPrice):0),
    rent:r&&r.rent!=null&&r.rent!==''?num(r.rent):(g&&g.rent!=null&&g.rent!==''?num(g.rent):0),
    deposit:r&&r.deposit!=null&&r.deposit!==''?num(r.deposit):(g&&g.deposit!=null&&g.deposit!==''?num(g.deposit):0),
    netFee:r&&r.netFee!=null&&r.netFee!==''?num(r.netFee):(g&&g.netFee!=null&&g.netFee!==''?num(g.netFee):0),
    garbageFee:r&&r.garbageFee!=null&&r.garbageFee!==''?num(r.garbageFee):(g&&g.garbageFee!=null&&g.garbageFee!==''?num(g.garbageFee):0),
    mgmtFee:r&&r.mgmtFee!=null&&r.mgmtFee!==''?num(r.mgmtFee):(g&&g.mgmtFee!=null&&g.mgmtFee!==''?num(g.mgmtFee):0),
    parkFee:r&&r.parkFee!=null&&r.parkFee!==''?num(r.parkFee):(g&&g.parkFee!=null&&g.parkFee!==''?num(g.parkFee):0),
    extraFee:r&&r.extraFee!=null&&r.extraFee!==''?num(r.extraFee):(g&&g.extraFee!=null&&g.extraFee!==''?num(g.extraFee):0)
  };
}
function effectiveReadings(list,roomId){
  const rs=list.filter(r=>r.roomId===roomId).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
  let offset=0;
  return rs.map((r,i)=>{
    let eff;
    if(r.event===RESET_EVENT){offset=num(r.reading);eff=offset;}
    else{eff=offset+num(r.reading);}
    return Object.assign({},r,{eff,baseUsed:(r.event!==RESET_EVENT&&r.base!=null&&r.base!=='')?num(r.base):0});
  });
}
function lastReadingBefore(list,roomId,beforeDate){
  const eff=effectiveReadings(list,roomId);
  let last=null;
  for(const r of eff){if(r.date<beforeDate)last=r;else break;}
  return last;
}
function lastReadingIn(list,roomId,period,untilDate){
  const [y,m]=period.split('-').map(Number);
  const start=y+'-'+pad2(m)+'-01',end=y+'-'+pad2(m)+'-'+lastDayOfMonth(period);
  const eff=effectiveReadings(list,roomId);
  let last=null;
  for(const r of eff){
    if(r.date>=start&&r.date<=end){if(untilDate&&r.date>untilDate)break;last=r;}
  }
  return last;
}
function monthUsage(list,roomId,period,untilDate){
  const prev=lastReadingBefore(list,roomId,period+'-01');
  const curr=lastReadingIn(list,roomId,period,untilDate);
  let usage=null;
  if(prev&&curr){
    const eff=effectiveReadings(list,roomId);
    const iPrev=eff.findIndex(x=>x.id===prev.id);
    const iCurr=eff.findIndex(x=>x.id===curr.id);
    const hasReset=prev.event===RESET_EVENT||eff.slice(iPrev+1,iCurr).some(x=>x.event===RESET_EVENT);
    const b=curr.base!=null&&curr.base!==''?num(curr.base):0;
    if(hasReset&&(curr.base!=null&&curr.base!==''||curr.event!==RESET_EVENT))usage=money(curr.eff-prev.eff-b);
    else usage=money(curr.eff-prev.eff);
  }
  else if(!prev&&curr){
    const eff=effectiveReadings(list,roomId);
    const first=eff.find(x=>x.date>=period+'-01'&&x.date<=period+'-31');
    const b=curr.base!=null&&curr.base!==''?num(curr.base):0;
    if(first&&first.event===RESET_EVENT&&first.id!==curr.id)usage=money(curr.eff-first.eff-b);
    else if(curr.base!=null&&curr.base!=='')usage=money(curr.eff-b);
  }
  return {prev,curr,usage};
}
function prevMonthOf(period){
  const [y,m]=period.split('-').map(Number);
  return m===1?(y-1)+'-12':y+'-'+pad2(m-1);
}
function nextMonthOf(period){
  const [y,m]=period.split('-').map(Number);
  return m===12?(y+1)+'-01':y+'-'+pad2(m+1);
}
function daysInMonthOf(period){
  const [y,m]=period.split('-').map(Number);
  return new Date(y,m,0).getDate();
}
function billRentOf(roomId,period,endOverride,tenant){
  // 收款月房租：按租客在 period 月的实际在住天数折算（月底入住/退租都按天）
  const [y,m]=period.split('-').map(Number);
  const total=daysInMonthOf(period);
  const start=y+'-'+pad2(m)+'-01',end=y+'-'+pad2(m)+'-'+total;
  const t=tenant||primaryTenant(roomId);
  const ls=t&&t.leaseStart?t.leaseStart:'';
  const le=endOverride||(t&&t.leaseEnd?t.leaseEnd:'');
  if(ls&&ls>end)return {days:0,total,note:'该月未入住'};
  if(le&&le<start)return {days:0,total,note:'该月已退租'};
  let from=ls>start?ls:start;
  let to=le&&le<end?le:end;
  if(ls&&ls>start&&le&&le<end&&le<ls)return {days:0,total,note:'该月不在租'};
  const d1=from.split('-').map(Number),d2=to.split('-').map(Number);
  const days=Math.round((new Date(d2[0],d2[1]-1,d2[2])-new Date(d1[0],d1[1]-1,d1[2]))/86400000)+1;
  const prorated=days>=total;
  const note=prorated?'全月 '+total+' 天':(ls&&ls>start?'自 '+ls+' 入住，按 '+days+'/'+total+' 天折算':'至 '+le+' 退租，按 '+days+'/'+total+' 天折算');
  return {days,total,note};
}
function rentByDays(roomId,period,endOverride,tenant){
  const o=billRentOf(roomId,period,endOverride,tenant);
  const p=priceOf(roomId,period);
  return {days:o.days,total:o.total,note:o.note,rent:money(p.rent*o.days/o.total),price:p.rent};
}
function prevUsageOf(list,roomId,period){
  return monthUsage(list,roomId,prevMonthOf(period));
}
/* 换表组成备注：换表前用量 + 换表后用量（每项带单位） */
function meterNote(list,roomId,period,unit){
  unit=unit||'';
  const recs=list.filter(x=>x.roomId===roomId&&x.date>=period+'-01'&&x.date<=period+'-31').sort((a,b)=>a.date<b.date?-1:1);
  const reset=recs.find(x=>x.event===RESET_EVENT);
  if(!reset)return null;
  const prev=lastReadingBefore(list,roomId,period+'-01');
  const curr=recs[recs.length-1];
  const parts=[];
  if(prev!=null)parts.push('换表前 '+money(num(reset.reading)-num(prev.reading))+unit);
  const firstAfter=recs.find(x=>x.date>reset.date);
  if(firstAfter&&curr)parts.push('换表后 '+money(num(curr.reading)-(firstAfter.base!=null&&firstAfter.base!==''?num(firstAfter.base):0))+unit);
  return parts.length?parts.join(' + '):null;
}
/* ============ 分租分段计费（同房同月多人分段在住，按抄表拆分水电并匹配各自承租人） ============ */
function tenantsInMonth(roomId,period){
  const [y,m]=period.split('-').map(Number);
  const start=y+'-'+pad2(m)+'-01',end=y+'-'+pad2(m)+'-'+lastDayOfMonth(period);
  return state.tenants.filter(t=>t.roomId===roomId&&(t.role==='承租人'||!t.role)
    &&(!t.leaseStart||t.leaseStart<=end)&&(!t.leaseEnd||t.leaseEnd>=start))
    .sort((a,b)=>(a.leaseStart||'').localeCompare(b.leaseStart||''));
}
function readingOn(list,roomId,date){
  const eff=effectiveReadings(list,roomId);
  let last=null;
  for(const r of eff){if(r.date===date)last=r;else if(r.date>date)break;}
  return last;
}
/* 返回：null=无需拆分；{need:[...]}=缺切换日抄表；[ {tenant,start,end,prevW,currW,prevE,currE,wUsage,eUsage,wCost,eCost} ]=分段列表 */
function splitUtil(roomId,um){
  const tenants=tenantsInMonth(roomId,um);
  if(tenants.length<2)return null;
  const [y,m]=um.split('-').map(Number);
  const start=y+'-'+pad2(m)+'-01',end=y+'-'+pad2(m)+'-'+lastDayOfMonth(um);
  const cuts=[];
  tenants.forEach(t=>{
    if(t.leaseEnd&&t.leaseEnd>=start&&t.leaseEnd<=end&&!cuts.includes(t.leaseEnd))cuts.push(t.leaseEnd);
  });
  const prevDayOf=d=>{const [yy,mm,dd]=d.split('-').map(Number);const dt=new Date(yy,mm-1,dd-1);return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());};
  tenants.forEach(t=>{
    if(t.leaseStart&&t.leaseStart>=start&&t.leaseStart<=end&&!cuts.includes(t.leaseStart)){
      // 入住日若紧跟前租客退租日，则无需单独抄表（退租日已抄）
      if(!tenants.some(x=>x.leaseEnd===prevDayOf(t.leaseStart)))cuts.push(t.leaseStart);
    }
  });
  cuts.sort();
  if(!cuts.length)return null;
  const miss=cuts.filter(c=>!readingOn(state.water,roomId,c)||!readingOn(state.elec,roomId,c));
  if(miss.length)return {need:miss};
  const days=new Set(cuts);
  effectiveReadings(state.water,roomId).forEach(r=>{if(r.date>=start&&r.date<=end)days.add(r.date);});
  effectiveReadings(state.elec,roomId).forEach(r=>{if(r.date>=start&&r.date<=end)days.add(r.date);});
  const dayList=[...days].sort();
  // 虚拟起点：月初前最后一条水/电记录（覆盖月初到首个抄表日的用量）
  const wPrev=lastReadingBefore(state.water,roomId,start),ePrev=lastReadingBefore(state.elec,roomId,start);
  const vStart=(wPrev&&ePrev)?(wPrev.date>ePrev.date?wPrev.date:ePrev.date):(wPrev||ePrev||null);
  if(vStart&&dayList[0]&&vStart<dayList[0])dayList.unshift(vStart);
  const segs=[];
  for(let i=1;i<dayList.length;i++){
    const d0=dayList[i-1],d1=dayList[i];
    const mid=new Date(Math.round((+new Date(d0)+ +new Date(d1))/2));
    const midStr=mid.getFullYear()+'-'+pad2(mid.getMonth()+1)+'-'+pad2(mid.getDate());
    const t=tenants.find(x=>(!x.leaseStart||x.leaseStart<=midStr)&&(!x.leaseEnd||x.leaseEnd>=midStr));
    if(!t)continue;
    const w0=readingOn(state.water,roomId,d0),w1=readingOn(state.water,roomId,d1);
    const e0=readingOn(state.elec,roomId,d0),e1=readingOn(state.elec,roomId,d1);
    if(!w1&&!e1)continue;
    segs.push({start:d0,end:d1,tenant:t,
      prevW:w0?w0.reading:null,currW:w1?w1.reading:null,
      prevE:e0?e0.reading:null,currE:e1?e1.reading:null,
      wUsage:w0&&w1?money(w1.eff-w0.eff):null,
      eUsage:e0&&e1?money(e1.eff-e0.eff):null});
  }
  const map=new Map();
  segs.forEach(s=>{
    const k=s.tenant.id;
    if(!map.has(k))map.set(k,{tenant:s.tenant,segs:[],wUsage:0,eUsage:0});
    const o=map.get(k);
    o.segs.push(s);
    if(s.wUsage!=null)o.wUsage+=s.wUsage;
    if(s.eUsage!=null)o.eUsage+=s.eUsage;
  });
  const list=[...map.values()];
  if(list.length<2)return null;
  const p=priceOf(roomId,um);
  list.forEach(o=>{
    o.wUsage=money(o.wUsage);o.eUsage=money(o.eUsage);
    o.start=o.segs[0].start;o.end=o.segs[o.segs.length-1].end;
    o.prevW=o.segs[0].prevW;o.currW=o.segs[o.segs.length-1].currW;
    o.prevE=o.segs[0].prevE;o.currE=o.segs[o.segs.length-1].currE;
    o.wCost=o.wUsage!=null?money(o.wUsage*p.waterPrice):null;
    o.eCost=o.eUsage!=null?money(o.eUsage*p.elecPrice):null;
  });
  return list;
}

  const eff=effectiveReadings(list,roomId);
  return eff[eff.length-1]||null;
}

function ageOf(t){
  const b=t&&t.birth?String(t.birth):'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(b))return '—';
  const [y,m,d]=b.split('-').map(Number);
  const now=new Date();
  let age=now.getFullYear()-y;
  if(now.getMonth()+1<m||(now.getMonth()+1===m&&now.getDate()<d))age--;
  return age>=0&&age<150?age:'—';
}
function roomSortKey(t){
  const no=roomNo(t.roomId)||'';
  const n=parseFloat(no);
  return [isNaN(n)?1e9:n,no,t.role==='同住人'?1:0,String(t.leaseStart||'')];
}
function sortTenantsByRoom(list){
  return list.slice().sort((a,b)=>{
    const ka=roomSortKey(a),kb=roomSortKey(b);
    for(let i=0;i<ka.length;i++){if(ka[i]<kb[i])return -1;if(ka[i]>kb[i])return 1;}
    return 0;
  });
}

const _chartReg=new WeakMap();
function initChart(el){
  const old=_chartReg.get(el);
  if(old)old.dispose();
  else{
    window.addEventListener('resize',()=>{const c=_chartReg.get(el);if(c)c.resize();});
    _chartReg.set(el,null);
  }
  const chart=echarts.init(el);
  _chartReg.set(el,chart);
  return chart;
}
let ovTrendMonths=6,ovTrendType='line',ovTrendScope=null;
function renderTrend(){
  const el=document.getElementById('trendChart');
  if(!el)return;
  const vis=document.querySelector('.chart-card.active');
  const tm=(vis&&vis.querySelector('.trendMonths'))||document.querySelector('.trendMonths');
  if(tm)ovTrendMonths=Number(tm.value)||6;
  const tt=(vis&&vis.querySelector('.trendType'))||document.querySelector('.trendType');
  if(tt)ovTrendType=tt.value;
  const ts=(vis&&vis.querySelector('.trendScope'))||document.querySelector('.trendScope');
  if(ts)ovTrendScope=ts.value;
  const tcMap={line:'tc-line',pie:'tc-pie',balance:'tc-bal',meterdiff:'tc-md'};
  Object.keys(tcMap).forEach(t=>{const c=document.getElementById(tcMap[t]);if(c)c.classList.toggle('active',t===ovTrendType);});
  setTimeout(()=>{const vis=document.querySelector('.chart-card.active');if(!vis)return;vis.querySelectorAll('[_echarts_instance_]').forEach(el=>{const ch=echarts.getInstanceByDom(el);if(ch)ch.resize();});},30);
  if(typeof echarts==='undefined'){
    const fb='<div class="chart-fallback">图表库未载入（需联网），已用表格数据代替。</div>';
    ['trendChart','pieChart','balChart','mdChart'].forEach(i=>{const e=document.getElementById(i);if(e)e.innerHTML=fb;});
    return;
  }
  const months=[];
  const d=new Date();
  for(let i=ovTrendMonths-1;i>=0;i--){
    const dt=new Date(d.getFullYear(),d.getMonth()-i,1);
    months.push(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'));
  }
  let scopeLabel='全屋';
  const bills=state.bills.filter(b=>months.includes(b.period));
  if(ovTrendScope&&ovTrendScope.startsWith('addr:')){
    const a=ovTrendScope.slice(5);scopeLabel=a;
    while(bills.length)bills.pop();
    bills.push(...state.bills.filter(b=>months.includes(b.period)&&addrOf(getRoom(b.roomId))===a));
  }else if(ovTrendScope&&ovTrendScope.startsWith('room:')){
    const rid=ovTrendScope.slice(5);scopeLabel=roomNo(rid)||rid;
    while(bills.length)bills.pop();
    bills.push(...state.bills.filter(b=>months.includes(b.period)&&b.roomId===rid));
  }
  const ws=months.map(m=>bills.filter(b=>b.period===m).reduce((s2,b)=>s2+num(b.waterCost),0));
  const es=months.map(m=>bills.filter(b=>b.period===m).reduce((s2,b)=>s2+num(b.elecCost),0));
  const scopeNote='（'+scopeLabel+' · '+ovTrendMonths+' 个月）';
  const setT=(id,txt)=>{const e=document.getElementById(id);if(e)e.innerHTML=ic('summary')+txt;};
  setT('trendTitle','水电费用走势（'+scopeLabel+'）');
  setT('pieTitle','费用构成'+scopeNote);
  setT('balTitle','收支对比'+scopeNote);
  setT('mdTitle','总表 vs 分表差异'+scopeNote);
  document.querySelectorAll('.trendMonths').forEach(e=>e.value=String(ovTrendMonths));
  document.querySelectorAll('.trendType').forEach(e=>e.value=ovTrendType);
  document.querySelectorAll('.trendScope').forEach(e=>{const o=e.querySelector('option[value="'+esc(ovTrendScope)+'"]');if(o)e.value=ovTrendScope;});
  /* ---------- 折线图 ---------- */
  (()=>{
    const c=document.getElementById('trendChart');if(!c)return;
    const chart=initChart(c);
    chart.setOption({
      grid:{left:50,right:16,top:30,bottom:28},
      tooltip:{trigger:'axis',valueFormatter:v=>moneyFmt(v)},
      legend:{data:['水费','电费'],top:0,icon:'roundRect',itemWidth:12,itemHeight:8,type:'scroll'},
      xAxis:{type:'category',data:months.map(monthLabel),axisLine:{lineStyle:{color:'#D3DAE4'}},axisLabel:{color:'#54657A'}},
      yAxis:{type:'value',splitLine:{lineStyle:{color:'#EDF0F4'}},axisLabel:{color:'#8B98A8'}},
      series:[
        {name:'水费',type:'line',data:ws,smooth:true,areaStyle:{opacity:0.08},itemStyle:{color:'#0891B2'}},
        {name:'电费',type:'line',data:es,smooth:true,areaStyle:{opacity:0.08},itemStyle:{color:'#D97706'}}
      ]
    });
  })();
  /* ---------- 饼图 ---------- */
  (()=>{
    const c=document.getElementById('pieChart');if(!c)return;
    const cats=[
      {name:'水费',v:bills.reduce((s2,b)=>s2+num(b.waterCost),0),color:'#38BDF8'},
      {name:'电费',v:bills.reduce((s2,b)=>s2+num(b.elecCost),0),color:'#FBBF24'},
      {name:'房租',v:bills.reduce((s2,b)=>s2+num(b.rent),0),color:'#A78BFA'},
      {name:'垃圾清洁费',v:bills.reduce((s2,b)=>s2+num(b.garbageFee),0),color:'#34D399'},
      {name:'网络费',v:bills.reduce((s2,b)=>s2+num(b.netFee),0),color:'#94A3B8'},
      {name:'物业管理费',v:bills.reduce((s2,b)=>s2+num(b.mgmtFee),0),color:'#60A5FA'},
      {name:'停车费',v:bills.reduce((s2,b)=>s2+num(b.parkFee),0),color:'#A3E635'},
      {name:'其他杂费',v:bills.reduce((s2,b)=>s2+num(b.extraFee)+num(b.otherFee),0),color:'#FB7185'},
      {name:'上月杂费',v:bills.reduce((s2,b)=>s2+num(b.prevUtilCost),0),color:'#2DD4BF'}
    ].filter(x=>x.v>0);
    if(!cats.length){
      c.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;color:var(--text-3);font-size:13px;text-align:center">所选范围暂无费用数据</div>';
      return;
    }
    c.innerHTML='';
    const lg=document.createElement('div');
    lg.style.cssText='display:flex;flex-wrap:wrap;gap:5px 14px;justify-content:center;align-items:center;margin:2px 2px 8px;font-size:12px;color:var(--text-2);max-width:100%';
    cats.forEach(ct=>{
      const it=document.createElement('span');
      it.style.cssText='display:inline-flex;align-items:center;gap:5px;white-space:nowrap';
      it.innerHTML='<span style="width:10px;height:10px;border-radius:3px;background:'+ct.color+';display:inline-block;flex:none"></span><span>'+ct.name+'</span><b class="num" style="font-weight:600">'+moneyFmt(ct.v)+'</b>';
      lg.appendChild(it);
    });
    const box=document.createElement('div');
    box.style.cssText='width:100%;min-height:240px';
    c.appendChild(box);c.appendChild(lg);
    const chart=initChart(box);
    chart.setOption({
      tooltip:{trigger:'item',formatter:p=>p.name+'<br>'+moneyFmt(p.value)+'（'+p.percent+'%）'},
      series:[{
        type:'pie',radius:['34%','64%'],center:['50%','46%'],
        data:cats.map(ct=>({name:ct.name,value:ct.v})),
        label:{fontSize:12,formatter:'{b}\n{d}%'},
        color:cats.map(ct=>ct.color),
        itemStyle:{borderRadius:6}
      }]
    });
  })();
  /* ---------- 收支对比 ---------- */
  (()=>{
    const c=document.getElementById('balChart');if(!c)return;
    const inc=months.map(m=>bills.filter(b=>b.period===m&&b.status==='已缴').reduce((s2,b)=>s2+num(b.total),0));
    const exp=months.map(m=>state.expenses.filter(x=>String(x.date).startsWith(m)).reduce((s2,x)=>s2+num(x.amount),0));
    const chart=initChart(c);
    chart.setOption({
      grid:{left:50,right:16,top:30,bottom:28},
      tooltip:{trigger:'axis',valueFormatter:v=>'¥'+Number(v||0).toLocaleString('zh-HK',{minimumFractionDigits:2})},
      legend:{data:['收入','支出'],top:0,icon:'roundRect',itemWidth:12,itemHeight:8,type:'scroll'},
      xAxis:{type:'category',data:months.map(monthLabel),axisLine:{lineStyle:{color:'#D3DAE4'}},axisLabel:{color:'#54657A'}},
      yAxis:{type:'value',splitLine:{lineStyle:{color:'#EDF0F4'}},axisLabel:{color:'#8B98A8'}},
      series:[
        {name:'收入',type:'line',data:inc,smooth:true,areaStyle:{opacity:0.1},itemStyle:{color:'#15803D'}},
        {name:'支出',type:'line',data:exp,smooth:true,areaStyle:{opacity:0.08},itemStyle:{color:'#C4453F'}}
      ]
    });
  })();
  /* ---------- 总表 vs 分表差异 ---------- */
  (()=>{
    const c=document.getElementById('mdChart');if(!c)return;
    let mScope=null;
    if(ovTrendScope&&ovTrendScope.startsWith('addr:'))mScope=ovTrendScope.slice(5);
    else if(ovTrendScope&&ovTrendScope.startsWith('room:')){const rr=getRoom(ovTrendScope.slice(5));mScope=rr&&rr.addr?rr.addr:'';}
    const diffs=months.map(m=>{
      const ms=state.meters.filter(x=>x.period===m&&(!mScope||addrOf(x)===mScope));
      let wDiff=0,eDiff=0,wCost=0,eCost=0,has=false;
      ms.forEach(x=>{const d=meterDiff(x);if(d&&d.diff!=null){has=true;if(x.type==='w'){wDiff+=num(d.diff);wCost+=num(d.diffCost);}else{eDiff+=num(d.diff);eCost+=num(d.diffCost);}}});
      return {wDiff,eDiff,wCost,eCost,has};
    });
    if(!diffs.some(d=>d.has)){
      c.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;color:var(--text-3);font-size:13px;text-align:center">所选范围暂无总表记录，录入总表后自动生成对比</div>';

      legend:{data:['水度数差','电度数差','水差异金额','电差异金额'],top:0,icon:'roundRect',itemWidth:12,itemHeight:8,type:'scroll'},
      xAxis:{type:'category',data:months.map(monthLabel),axisLine:{lineStyle:{color:'#D3DAE4'}},axisLabel:{color:'#54657A'}},
      yAxis:[
        {type:'value',name:'度数',splitLine:{lineStyle:{color:'#EDF0F4'}},axisLabel:{color:'#8B98A8'}},
        {type:'value',name:'金额',splitLine:{show:false},axisLabel:{color:'#8B98A8'}}
      ],
      series:[
        {name:'水度数差',type:'bar',data:diffs.map(d=>d.wDiff),yAxisIndex:0,barWidth:'16%',itemStyle:{color:'#38BDF8',borderRadius:[4,4,0,0]}},
        {name:'电度数差',type:'bar',data:diffs.map(d=>d.eDiff),yAxisIndex:0,barWidth:'16%',itemStyle:{color:'#FBBF24',borderRadius:[4,4,0,0]}},
        {name:'水差异金额',type:'bar',data:diffs.map(d=>d.wCost),yAxisIndex:1,barWidth:'16%',itemStyle:{color:'#0EA5E9',borderRadius:[4,4,0,0]}},
        {name:'电差异金额',type:'bar',data:diffs.map(d=>d.eCost),yAxisIndex:1,barWidth:'16%',itemStyle:{color:'#F59E0B',borderRadius:[4,4,0,0]}}
      ]
    });
  })();
}

function openRoomForm(id){

    '<div class="fgrid">'

    +field('地址 / 楼栋',inp('addr',r?(r.addr||''):'',{placeholder:'如 深水埗南昌街 123 号'}))
    +field('出租状态',sel('status',ROOM_STATUS.map(s=>({v:s,l:s})),r?r.status:'在租'))

    +'</div>'
    ,'<button class="btn" data-close>取消</button><button class="btn primary" id="saveRoom">保存</button>'));
  const box=ov.querySelector('#amenBox');
  const picked=new Set((r&&r.amenities)||[]);
  box.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
    el.classList.toggle('on');
    if(el.classList.contains('on'))picked.add(el.dataset.a);else picked.delete(el.dataset.a);
  }));
  const addChip=()=>{
    const v=ov.querySelector('#amenCustom').value.trim();
    if(!v)return;
    if(!picked.has(v)&&!AMENITIES.includes(v)){
      const s=document.createElement('span');
      s.className='opt on';s.dataset.a=v;s.textContent=v;
      s.addEventListener('click',()=>{s.classList.toggle('on');if(s.classList.contains('on'))picked.add(v);else picked.delete(v);});
      box.appendChild(s);picked.add(v);
    }
    ov.querySelector('#amenCustom').value='';
  };
  ov.querySelector('#amenAdd').onclick=addChip;
  ov.querySelector('#amenCustom').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addChip();}});
  ov.querySelector('#saveRoom').onclick=()=>{
    const no=ov.querySelector('[name=no]').value.trim();
    if(!no){toast('请填写房号','err');return;}

    rec.no=no;

    rec.area=ov.querySelector('[name=area]').value;
    rec.layout=ov.querySelector('[name=layout]').value.trim();
    rec.addr=ov.querySelector('[name=addr]').value.trim();
    rec.status=ov.querySelector('[name=status]').value;
    rec.remark=ov.querySelector('[name=remark]').value.trim();
    rec.amenities=[...picked];
    if(isNew)state.rooms.push(rec);
    save();closeModal(ov);drawRooms();toast(isNew?'已新增房间 '+no:'已保存房间 '+no,'ok');
  };
}

let docDB=null;
function openDocDB(){

function idbPut(k,blob){return new Promise(res=>{if(!docDB)return res(false);try{const tx=docDB.transaction('imgs','readwrite');tx.objectStore('imgs').put({k:k,blob:blob});tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
function idbGet(k){return new Promise(res=>{if(!docDB||!k)return res(null);try{const tx=docDB.transaction('imgs','readonly');const rq=tx.objectStore('imgs').get(k);rq.onsuccess=()=>res(rq.result?rq.result.blob:null);rq.onerror=()=>res(null);}catch(e){res(null);}});}
function idbDel(k){if(docDB&&k){try{const tx=docDB.transaction('imgs','readwrite');tx.objectStore('imgs').delete(k);}catch(e){}}}
/* 手写 ZIP（STORE 无压缩），导出整理好的文件夹结构 */
function crc32(u8){
  let c;const table=[];
  for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;table[n]=c>>>0;}
  let crc=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)crc=table[(crc^u8[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function zipStore(entries){
  const enc=new TextEncoder();
  const parts=[],cent=[];let offset=0;
  const d=new Date();
  const dt=((d.getUTCFullYear()-1980)<<9)|((d.getUTCMonth()+1)<<5)|d.getUTCDate();
  entries.forEach(e=>{
    const nameU8=enc.encode(e.name);
    const crc=crc32(e.data),size=e.data.length;
    const lh=new Uint8Array(30+nameU8.length);
    const v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);v.setUint16(10,0,true);v.setUint16(12,dt,true);
    v.setUint32(14,crc,true);v.setUint32(18,size,true);v.setUint32(22,size,true);v.setUint16(26,nameU8.length,true);v.setUint16(28,0,true);
    lh.set(nameU8,30);
    parts.push(lh,e.data);
    const ch=new Uint8Array(46+nameU8.length);
    const v2=new DataView(ch.buffer);
    v2.setUint32(0,0x02014b50,true);v2.setUint16(4,20,true);v2.setUint16(6,20,true);v2.setUint16(8,0x0800,true);v2.setUint16(10,0,true);v2.setUint16(12,0,true);v2.setUint16(14,dt,true);
    v2.setUint32(16,crc,true);v2.setUint32(20,size,true);v2.setUint32(24,size,true);v2.setUint16(28,nameU8.length,true);v2.setUint16(30,0,true);v2.setUint16(32,0,true);v2.setUint16(34,0,true);v2.setUint16(36,0,true);v2.setUint32(38,0,true);v2.setUint32(42,offset,true);
    ch.set(nameU8,46);
    cent.push(ch);
    offset+=lh.length+size;
  });
  const cdLen=cent.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array(22);
  const v3=new DataView(eocd.buffer);
  v3.setUint32(0,0x06054b50,true);v3.setUint16(8,entries.length,true);v3.setUint16(10,entries.length,true);
  v3.setUint32(12,cdLen,true);v3.setUint32(16,offset,true);
  const all=[...parts,...cent,eocd];
  const total=all.reduce((s,a)=>s+a.length,0);
  const out=new Uint8Array(total);
  let p=0;
  all.forEach(a=>{out.set(a,p);p+=a.length;});
  return out;
}
function unzipStore(buf){
  const u=new Uint8Array(buf);
  const out=[];
  let eocd=-1;
  const maxBack=Math.min(u.length,65557);
  for(let i=u.length-22;i>=Math.max(0,u.length-maxBack);i--){
    if(u[i]===0x50&&u[i+1]===0x4b&&u[i+2]===0x05&&u[i+3]===0x06){eocd=i;break;}
  }
  if(eocd<0)return out;
  const dv=new DataView(u.buffer,u.byteOffset,u.byteLength);
  const cdOff=dv.getUint32(eocd+16,true),cdLen=dv.getUint32(eocd+12,true);
  let pos=cdOff;const end=cdOff+cdLen;
  while(pos+46<=end&&u[pos]===0x50&&u[pos+1]===0x4b&&u[pos+2]===0x01&&u[pos+3]===0x02){
    const flag=dv.getUint16(pos+8,true),method=dv.getUint16(pos+10,true);
    const comp=dv.getUint32(pos+20,true);
    const nlen=dv.getUint16(pos+28,true),elen=dv.getUint16(pos+30,true),clen=dv.getUint16(pos+32,true);
    const off=dv.getUint32(pos+42,true);
    let name;
    try{name=new TextDecoder(flag&0x800?'utf-8':'utf-8').decode(u.subarray(pos+46,pos+46+nlen));}catch(e){name=new TextDecoder().decode(u.subarray(pos+46,pos+46+nlen));}
    if(method===0&&off+30<=u.length&&u[off]===0x50&&u[off+1]===0x4b&&u[off+2]===0x03&&u[off+3]===0x04){
      const lnlen=dv.getUint16(off+26,true),lelen=dv.getUint16(off+28,true);
      const dataStart=off+30+lnlen+lelen;
      if(dataStart+comp<=u.length)out.push({name:name,data:u.slice(dataStart,dataStart+comp)});
    }
    pos+=46+nlen+elen+clen;
  }
  return out;
}
async function applyDocEntries(entries){
  let nId=0,nCt=0,nSkip=0,skipN=[];
  for(const en of entries){
    const parts=en.name.split('/').filter(Boolean);
    if(parts.length<3||parts[0]!=='出租屋资料'||(parts[1]!=='身份证'&&parts[1]!=='合同')){
      nSkip++;if(skipN.length<5)skipN.push(en.name);continue;
    }
    const kind=parts[1]==='身份证'?'idcard':'contract';
    const tname=parts.slice(2,-1).join('/').trim();
    const fname=parts[parts.length-1];
    if(!fname||fname.startsWith('.')||!en.data.length){nSkip++;continue;}
    const t=state.tenants.find(x=>(x.name||'').trim()===tname);
    if(!t){nSkip++;if(skipN.length<5)skipN.push(en.name);continue;}
    if(!t.docs)t.docs={idcard:[],contract:[]};
    if(!Array.isArray(t.docs[kind]))t.docs[kind]=[];
    const ext=fname.toLowerCase();
    const mime=ext.endsWith('.png')?'image/png':ext.endsWith('.webp')?'image/webp':ext.endsWith('.gif')?'image/gif':ext.endsWith('.bmp')?'image/bmp':'image/jpeg';
    const k=uid();
    const stored=await idbPut(k,new Blob([en.data],{type:mime}));
    const ex=t.docs[kind].find(x=>x.name===fname);
    if(ex){ex.local=k;ex.path='浏览器本地（导入资料包）';ex.ts=docTS();}
    else t.docs[kind].push({name:fname,path:'浏览器本地（导入资料包）',ts:docTS(),local:k});
    if(kind==='idcard')nId++;else nCt++;
  }
  return {ok:nId+nCt>0,id:nId,ct:nCt,skip:nSkip};
}
async function applyDocsZip(buf){
  const entries=unzipStore(buf);
  if(!entries.length)return {ok:false,msg:'压缩包解析失败或为空，请使用本系统「导出资料包」生成的 ZIP'};
  const r=await applyDocEntries(entries);
  save();
  if(docModalId&&document.getElementById('docBody')&&getTenant(docModalId))redrawDocs();
  else if(document.getElementById('tenantSearch'))drawTenants();
  let msg='已导入 '+r.id+' 张身份证、'+r.ct+' 张合同';
  if(r.skip)msg+='；跳过 '+r.skip+' 个文件';
  return {ok:r.ok,msg:msg,id:r.id,ct:r.ct,skip:r.skip};
}
async function importDocsZip(){
  const fi=document.createElement('input');
  fi.type='file';fi.accept='.zip,application/zip';
  fi.onchange=async()=>{
    const file=fi.files&&fi.files[0];
    if(!file)return;
    toast('正在解析资料包…');
    try{
      const r=await applyDocsZip(await file.arrayBuffer());
      toast(r.msg,r.ok?'ok':'err');
    }catch(err){toast('导入失败：'+err.message,'err');}
  };
  fi.click();
}

    for(const kind of ['idcard','contract']){
      const kindName=kind==='idcard'?'身份证':'合同';
      const rec=(t.docs&&t.docs[kind])||[];
      for(const r of rec){
        let blob=null;
        const m=files.find(f=>f.name===r.name);
        if(m)blob=m.blob;
        else if(r.local)blob=await idbGet(r.local);
        if(blob)entries.push({name:'出租屋资料/'+kindName+'/'+tname+'/'+r.name,data:new Uint8Array(await blob.arrayBuffer())});
      }
    }
  }
  if(!entries.length){toast('没有找到可导出的图片文件','err');return;}
  downloadBlob(new Blob([zipStore(entries)],{type:'application/zip'}),'出租屋资料包_'+(tid?'单个租客_':'全部_')+todayStr()+'.zip');
  toast('已导出 '+entries.length+' 个文件','ok');
}
/* ============ 证件资料（身份证 / 合同，保存到资料文件夹） ============ */
let docDirHandle=null;   /* File System Access 写入文件夹句柄（会话内） */
let docFiles=[];         /* 已读取/已写入的图片文件索引 {rel,name,url,blob,dir} */
let docModalId=null;
function docTS(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function pickDocFolder(){
  const fi=document.createElement('input');
  fi.type='file';
  fi.setAttribute('webkitdirectory','');
  fi.setAttribute('directory','');
  fi.onchange=()=>{
    docFiles=[];
    [...(fi.files||[])].forEach(f=>{
      const rel=f.webkitRelativePath||f.name;
      const parts=rel.split('/').filter(Boolean);
      if(parts.length<2)return;
      const fn=parts[parts.length-1].toLowerCase();
      if(!/\.(jpe?g|png|webp|gif|bmp|jfif)$/i.test(fn))return;
      docFiles.push({rel:parts.slice(1).join('/'),name:parts[parts.length-1],url:URL.createObjectURL(f),blob:f,dir:parts.slice(1,-1).join('/')});
    });
    toast('已读取资料文件夹：'+docFiles.length+' 张图片');
    redrawDocs();
  };
  fi.click();
}
function openTenantDocs(id){
  docModalId=id;
  const t=getTenant(id);
  if(!t)return;
  t.docs=t.docs||{idcard:[],contract:[]};

  if(bz)bz.onclick=()=>exportDocsZip(id);

function docsOf(kind){
  const t=getTenant(docModalId);
  if(!t)return[];
  t.docs=t.docs||{idcard:[],contract:[]};
  return t.docs[kind]||[];
}
function relFilesOf(kind,tid){
  const t=getTenant(tid||docModalId);
  if(!t)return[];
  const dir=(kind==='idcard'?'身份证':'合同')+'/'+(t.name||'').trim();
  return docFiles.filter(f=>f.dir===dir);
}
function redrawDocs(){

    +'<button class="btn sm" id="dImportZip">'+ic('up')+'导入资料包</button>'
    +'</div></div>'
    +docSecHTML('身份证','idcard')

  const b1=document.getElementById('dSetFolder');
  if(b1)b1.onclick=async()=>{
    if(!window.showDirectoryPicker){toast('当前浏览器不支持直接写入文件夹：请把下载的图片移入资料文件夹，或用「读取资料文件夹」查看','err');return;}
    try{docDirHandle=await window.showDirectoryPicker({mode:'readwrite'});toast('已选择写入文件夹','ok');redrawDocs();}
    catch(e){if(e&&e.name!=='AbortError')toast('选择已取消','err');}
  };

function fillLocalThumbs(kind){
  const rec=docsOf(kind);
  document.querySelectorAll('#thumbs_'+kind+' .doc-it[data-local="1"]').forEach(el=>{
    const r=rec.find(x=>x.name===el.dataset.name);
    if(r&&r.local){
      idbGet(r.local).then(b=>{
        if(b){
          const host=el.querySelector('.ph');
          if(host)host.outerHTML='<img src="'+URL.createObjectURL(b)+'">';
        }
      });
    }
  });
}
function docSecHTML(kindName,kind){
  const rec=docsOf(kind);
  const files=relFilesOf(kind);
  const used=new Set();
  const items=rec.map(r=>{
    const m=files.find(f=>f.name===r.name);
    if(m){used.add(r.name);return {name:r.name,src:m.url,path:r.path||m.rel,local:false};}
    return {name:r.name,src:null,path:r.path||'',local:!!r.local};
  });
  files.forEach(f=>{if(!used.has(f.name))items.push({name:f.name,src:f.url,path:f.rel,local:false});});
  return '<h4 style="font-size:13.5px;margin:14px 0 8px;display:flex;align-items:center;gap:8px">'+esc(kindName)+'（'+items.length+' 张）'
    +'<span style="margin-left:auto;display:flex;gap:6px">'
    +'<button class="btn sm" data-docact="take" data-kind="'+kind+'">'+ic('camera')+'拍照</button>'
    +'<button class="btn sm" data-docact="pick" data-kind="'+kind+'">'+ic('up')+'上传</button>'
    +'</span></h4>'
    +'<div class="doc-thumbs" id="thumbs_'+kind+'">'
    +(items.length?items.map((it,i)=>'<div class="doc-it'+(it.src||it.local?'':' doc-miss')+'"'+(it.local?' data-local="1" data-name="'+esc(it.name)+'"':'')+' title="'+esc(it.path)+'">'
      +(it.src?'<img src="'+it.src+'">':'<span class="ph">'+ic('doc')+'</span>')
      +'<span class="nm">'+esc(it.name)+'</span>'
      +'<button class="del" data-dockind="'+kind+'" data-dname="'+esc(it.name)+'">×</button>'
      +'</div>').join(''):'<div style="font-size:12.5px;color:var(--text-3);padding:6px 2px">暂无图片，点「拍照 / 上传」添加</div>')
    +'</div>';
}
function bindDocSec(kind){
  const body=document.getElementById('docBody');
  if(!body)return;
  body.querySelectorAll('[data-docact][data-kind="'+kind+'"]').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();fireDocInput(kind,b.dataset.docact==='take');});
  });
  const th=body.querySelector('#thumbs_'+kind);
  if(th){
    // 事件委托：静态与动态（手机本地图）缩略图都能点击放大
    th.addEventListener('click',e=>{
      const img=e.target.closest('img');
      if(!img)return;
      openModal(modalShell('图片预览','<div style="text-align:center"><img src="'+img.src+'" style="max-width:100%;max-height:62vh;border-radius:10px"></div>','<button class="btn" data-close>关闭</button>'),{wide:true});
    });
    th.querySelectorAll('.del').forEach(d=>d.addEventListener('click',e=>{
      e.stopPropagation();
      delDocItem(d.dataset.dockind,d.dataset.dname);
    }));
  }
}
function delDocItem(kind,name){
  const rec=docsOf(kind);
  const files=relFilesOf(kind);
  const same=files.find(f=>f.name===name);
  if(same){toast('资料文件夹内有该文件，请直接在文件夹中删除','err');return;}
  const i=rec.findIndex(r=>r.name===name);
  if(i>=0){
    if(rec[i].local)idbDel(rec[i].local);
    rec.splice(i,1);
    save();redrawDocs();toast('已删除','ok');
  }
}
function fireDocInput(kind,capture){
  const t=getTenant(docModalId);
  if(!t)return;
  const fi=document.createElement('input');
  fi.type='file';
  fi.accept='image/*';
  if(capture)fi.setAttribute('capture','environment');
  else fi.multiple=true;
  fi.onchange=async()=>{
    if(!fi.files||!fi.files.length)return;
    const tname=(t.name||'未命名').trim();
    const kindName=kind==='idcard'?'身份证':'合同';
    toast('正在保存 '+fi.files.length+' 张…');
    for(const f of [...fi.files]){
      const n=Date.now().toString().slice(-6)+'_'+f.name.replace(/[\\/:*?"<>|]/g,'_');
      const k=uid();
      await idbPut(k,f);   /* 先存浏览器本地，立即显示、可导出 */
      let path='浏览器本地（可导出资料包）';
      if(docDirHandle){
        try{
          const root=await docDirHandle.getDirectoryHandle('出租屋资料',{create:true});
          const kd=await root.getDirectoryHandle(kindName,{create:true});
          const nd=await kd.getDirectoryHandle(tname,{create:true});
          const fh=await nd.getFileHandle(n,{create:true});
          const w=await fh.createWritable();
          await w.write(f);
          await w.close();
          docFiles.push({rel:kindName+'/'+tname+'/'+n,name:n,url:URL.createObjectURL(f),blob:f,dir:kindName+'/'+tname});
          path='出租屋资料/'+kindName+'/'+tname+'/'+n;
        }catch(e){toast('写入文件夹失败：'+e.message,'err');}
      }
      docsOf(kind).push({name:n,path:path,ts:docTS(),local:k});
      save();
    }
    toast('已保存，可导出资料包','ok');
    redrawDocs();
  };
  fi.click();
}
function tenantExportRows(){
  const docsN=t=>{const d=t.docs||{};return (d.idcard||[]).length+(d.contract||[]).length;};
  return [['姓名','房号','电话','身份证号','性别','年龄','户籍省市','入住时间','租期至','押金(元)','状态','证件数','备注']]
    .concat(sortTenantsByRoom(state.tenants).map(t=>{
      const r=getRoom(t.roomId);
      return [t.name||'',r?r.no:'',t.phone||'',t.idcard||'',t.gender||'',ageOf(t),t.idAddr||'',t.leaseStart||'',t.leaseEnd||'',t.deposit!=null&&t.deposit!==''?num(t.deposit):'',t.status||'在住',docsN(t),t.remark||''];
    }));
}
function downloadCSV(name,rows){
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),name);
}
function exportTenantsExcel(){
  const rows=tenantExportRows();
  const name='租客信息表-'+todayStr()+'.xlsx';
  const doExport=ok=>{
    if(ok&&window.XLSX){
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:8},{wch:10},{wch:6},{wch:20},{wch:14},{wch:16},{wch:8},{wch:6},{wch:12},{wch:12},{wch:10},{wch:18}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'租客信息');
      const ab=XLSX.write(wb,{bookType:'xlsx',type:'array'});
      downloadBlob(new Blob([ab],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name);
      toast('已导出 Excel：'+name,'ok');
    }else{
      const csv=name.replace(/\.xlsx$/,'.csv');
      downloadCSV(csv,rows);
      toast('已导出 CSV（可用 Excel 打开）：'+csv,'ok');
    }
  };
  if(window.XLSX)doExport(true);
  else{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>doExport(true);
    s.onerror=()=>doExport(false);
    document.head.appendChild(s);
  }
}

    if(p&&state.prices.some(x=>x.roomId===p.roomId&&x.month===month&&x.id!==p.id)){toast('该房间 '+monthLabel(month)+' 已有价格版本，请选择其他月份','err');return;}
    rec.month=month;
    ['waterPrice','elecPrice','rent','deposit','garbageFee','netFee','mgmtFee','parkFee','extraFee'].forEach(k=>{rec[k]=ov.querySelector('[name='+k+']').value;});

  };
}
function delPrice(id){
